      pill.style.background = deg.bg
      pill.style.color = deg.color
      pill.style.borderColor = deg.color + '44'
      pill.textContent = `${deg.degree} ${note}`
      bar.appendChild(pill)
    })
  }

  function onKeyChange(key) {
    S.key = key
    updateKeyInfo()
    toast(`Key: ${key} Major`)
  }

  /* ═══════════════════════════════════════════════════════════
     RENDER — main track list
  ═══════════════════════════════════════════════════════════ */
  function render() {
    const inner = $('tracks-inner')
    // Preserve sticky elements before clearing
    const ruler  = $('ruler')
    const addRow = $('add-track-row')
    inner.innerHTML = ''

    inner.appendChild(ruler)   // ruler must be first (sticky top)

    if (S.tracks.length === 0) {
      const es = el('div', 'empty-state')
      es.innerHTML = `<div class="empty-icon">🎼</div><p>No tracks yet.<br>Click <strong>+ Add Track</strong> to start.</p>`
      inner.appendChild(es)
    } else {
      S.tracks.forEach(track => inner.appendChild(buildTrackRow(track)))
    }

    inner.appendChild(addRow)
  }

  function buildTrackRow(track) {
    const cfg = TRACK_CONFIGS[track.type] || { icon:'🎵', badge:'TRACK', name:'Track' }
    const isStructure = track.type === 'structure'
    const isSubTrack  = cfg.group === 'sub'
    const isFreeTrack = cfg.group === 'free'

    const row = el('div', 'track-row')
    row.dataset.trackId = track.id
    if (isStructure)              row.classList.add('is-structure')
    if (isSubTrack)               row.classList.add('is-sub-track')
    if (isFreeTrack)              row.classList.add('is-free-track')
    if (track.type==='lyrics')    row.classList.add('is-lyrics')
    if (track.type==='fretboard') row.classList.add('is-fretboard')
    if (track.type==='live-memo') row.classList.add('is-live-memo')
    if (track.type==='memos')     row.classList.add('is-memos')
    if (track.type==='staff') {
      row.classList.add('is-staff')
      if (_staffPaletteMode === 'select') row.classList.add('staff-select-mode')
    }
    if (track.collapsed)          row.classList.add('collapsed')
    if (isSubTrack && S.groupCollapsed) row.classList.add('group-hidden')

    // Toggle button — STRUCTURE gets group-toggle; sub-tracks get collapse toggle; FREE TRACKS get nothing
    const toggleBtn = isStructure
      ? `<button draggable="false" class="group-toggle${S.groupCollapsed?' closed':''}" onclick="toggleGroupCollapse()" title="Afficher/masquer les sous-pistes">▼</button>`
      : isSubTrack
        ? `<button draggable="false" class="track-toggle" onclick="toggleTrackCollapse('${track.id}')" title="Réduire/agrandir">▼</button>`
        : ''

    // Label — entire label is draggable; buttons carry draggable="false"
    const label = el('div', 'track-label')
    label.draggable = true
    label.innerHTML = `
      ${toggleBtn}
      <span class="track-icon" style="pointer-events:none">${cfg.icon}</span>
      <div class="track-info" style="pointer-events:none">
        <div class="track-name">${esc(track.name)}</div>
        <div class="track-type-badge">${cfg.badge}</div>
      </div>
      <div class="track-actions">
        <button draggable="false" class="track-btn" onclick="moveTrack('${track.id}',-1)" title="Monter">▲</button>
        <button draggable="false" class="track-btn danger" onclick="removeTrack('${track.id}')" title="Supprimer">✕</button>
        <button draggable="false" class="track-btn" onclick="moveTrack('${track.id}',1)" title="Descendre">▼</button>
      </div>
    `

    // Play button on Staff track header
    if (track.type === 'staff') {
      const playTrackBtn = el('button', 'staff-track-play')
      playTrackBtn.textContent = '▶'
      playTrackBtn.title = 'Lire toute la piste Staff'
      playTrackBtn.draggable = false
      playTrackBtn.style.pointerEvents = 'auto'
      playTrackBtn.addEventListener('click', e => {
        e.stopPropagation()
        playStaffTrack(track.id, playTrackBtn)
      })
      label.querySelector('.track-info').appendChild(playTrackBtn)
    }

    // Track drag-to-reorder
    label.addEventListener('dragstart', e => {
      if (e.target.closest('button')) { e.preventDefault(); return }
      _dragTrackId = track.id
      e.dataTransfer.effectAllowed = 'move'
      e.dataTransfer.setData('application/track-id', track.id)
      row.classList.add('track-dragging')
    })
    label.addEventListener('dragend', () => {
      _dragTrackId = null
      row.classList.remove('track-dragging')
      document.querySelectorAll('.track-drop-target').forEach(r => r.classList.remove('track-drop-target'))
    })
    row.addEventListener('dragover', e => {
      if (!_dragTrackId || _dragTrackId === track.id) return
      e.preventDefault()
      e.dataTransfer.dropEffect = 'move'
      document.querySelectorAll('.track-drop-target').forEach(r => r.classList.remove('track-drop-target'))
      row.classList.add('track-drop-target')
    })
    row.addEventListener('drop', e => {
      if (!_dragTrackId || _dragTrackId === track.id) return
      e.preventDefault()
      const fromIdx = S.tracks.findIndex(t => t.id === _dragTrackId)
      const toIdx   = S.tracks.findIndex(t => t.id === track.id)
      if (fromIdx >= 0 && toIdx >= 0) {
        const [moved] = S.tracks.splice(fromIdx, 1)
        S.tracks.splice(toIdx, 0, moved)
      }
      normalizeTrackOrder()
      _dragTrackId = null
      render()
    })

    row.appendChild(label)

    // Blocks area
    const blocksEl = el('div', 'track-blocks')
    blocksEl.style.minWidth = (MEASURES * MEASURE_WIDTH) + 'px'

    // Drag-and-drop onto track (palette → new block, chip → move/switch block)
    let _dragEnterCount = 0
    blocksEl.addEventListener('dragenter', e => {
      if (_dragTrackId) return
      e.preventDefault()
      _dragEnterCount++
      row.classList.add('drag-over')
    })
    blocksEl.addEventListener('dragover', e => { e.preventDefault() })
    blocksEl.addEventListener('dragleave', () => {
      _dragEnterCount--
      if (_dragEnterCount <= 0) { _dragEnterCount = 0; row.classList.remove('drag-over') }
    })
    blocksEl.addEventListener('drop', e => {
      e.preventDefault()
      _dragEnterCount = 0
      row.classList.remove('drag-over')
      const rect = blocksEl.getBoundingClientRect()
      const relX = e.clientX - rect.left
      const measure = Math.max(1, Math.floor(relX / MEASURE_WIDTH) + 1)

      // Moving an existing block?
      if (_dragBlockId) {
        const block = S.blocks.find(b => b.id === _dragBlockId)
        if (block) {
          block.trackId = track.id
          block.measure = measure
        }
        _dragBlockId = null
        render()
        return
      }

      // Palette drop → create new block
      const type = e.dataTransfer.getData('text/plain') || _dragType
      if (!type || !BLOCK_DEFS[type]) return
      dropBlock(type, track.id, measure)
    })

    // STAFF track: ghost note preview + click-to-place
    if (track.type === 'staff') {
      // Ghost overlay elements
      const ghost      = el('div', 'staff-ghost')
      const ghostGuide = el('div', 'staff-ghost-guide')   // horizontal pitch line
      const ghostStem  = el('div', 'staff-ghost-stem')    // vertical stem
      const ghostHead  = el('div', 'staff-ghost-head')    // notehead oval
      const ghostLbl   = el('span','staff-ghost-label')   // note name badge
      ghost.appendChild(ghostGuide)
      ghost.appendChild(ghostStem)
      ghost.appendChild(ghostHead)
      ghost.appendChild(ghostLbl)
      blocksEl.appendChild(ghost)

      // Selection box element
      const selBox = el('div', 'staff-selbox')
      blocksEl.appendChild(selBox)

      blocksEl.addEventListener('mousemove', e => {
        // Rubber-band live update
        if (_rubber && _rubber.trackId === track.id) {
          const rect = blocksEl.getBoundingClientRect()
          const curX = e.clientX - rect.left
          const curY = e.clientY - rect.top
          const x = Math.min(_rubber.startX, curX)
          const y = Math.min(_rubber.startY, curY)
          _rubber.selBoxEl.style.left   = x + 'px'
          _rubber.selBoxEl.style.top    = y + 'px'
          _rubber.selBoxEl.style.width  = Math.abs(curX - _rubber.startX) + 'px'
          _rubber.selBoxEl.style.height = Math.abs(curY - _rubber.startY) + 'px'
          return
        }
        // Show ghost only in draw mode
        if (_staffPaletteMode !== 'draw') { ghost.style.display = 'none'; return }
        if (_dragBlockId || _chipDragging || _resizing) { ghost.style.display = 'none'; return }
        const rect = blocksEl.getBoundingClientRect()
        const relX = e.clientX - rect.left
        const relY = e.clientY - rect.top
        if (relY < 18) { ghost.style.display = 'none'; return }

        // Determine scale of chip under cursor (expanded or not)
        const hoverMeasure = Math.max(1, Math.floor(relX / MEASURE_WIDTH) + 1)
        const hoverBlock = S.blocks.find(b =>
          b.trackId === track.id && b.measure <= hoverMeasure && (b.measure + b.measures - 1) >= hoverMeasure
        )
        const hoverScale = (hoverBlock && _expandedStaff.has(hoverBlock.id)) ? 2 : 1
        const [letter, oct] = staffYToPitch(relY, hoverScale)
        const acc = _spalAcc || ''
        const trackY = staffPitchToTrackY(letter, oct, hoverScale)

        // Compute next-note insert X (where the note will actually appear)
        let ghostX = relX  // fallback = cursor
        if (hoverBlock) {
          const gbpm   = parseInt((S.timeSign||'4/4').split('/')[0]) || 4
          const { totalBeats } = parseStaffTokens(hoverBlock.staffNotes, gbpm)
          const capacity = hoverBlock.measures * gbpm
          if (totalBeats >= capacity) {
            // Chip full — show "full" indicator instead of ghost
            ghostLbl.textContent = '⛔ Bloc plein'
            ghostLbl.style.left  = (relX + 6) + 'px'
            ghostLbl.style.top   = (trackY - 8) + 'px'
            ghostHead.style.display = 'none'
            ghostStem.style.display = 'none'
            ghostGuide.style.top    = '-100px'
            ghost.style.display     = 'block'
            return
          }
          const gkSig  = keySigInfo(S.key || 'C')
          const gHEADW = 18 + gkSig.count * 6 + 12 + 4
          const gChipW = hoverBlock.measures * MEASURE_WIDTH - 6
          const gNumM  = Math.max(1, Math.min(4, hoverBlock.measures || 1))
          const gMEASW = (gChipW - gHEADW) / gNumM
          const nextMeasIdx = Math.floor(totalBeats / gbpm)
          const nextBeatInM = totalBeats - nextMeasIdx * gbpm
          const svgX = gHEADW + nextMeasIdx * gMEASW + (nextBeatInM / gbpm) * gMEASW + 10
          ghostX = (hoverBlock.measure - 1) * MEASURE_WIDTH + 2 + svgX
        }
        ghostHead.style.display = ''
        ghostStem.style.display = ''

        // Stem direction
        const stemUp = trackY >= 54
        const STEM_H = 20
        const stemTop = stemUp ? trackY - STEM_H : trackY + 4

        // Horizontal guide — full width at exact pitch Y
        ghostGuide.style.top = (trackY - 1) + 'px'

        // Stem at insert X
        ghostStem.style.left   = (ghostX + 1) + 'px'
        ghostStem.style.top    = stemTop + 'px'
        ghostStem.style.height = STEM_H + 'px'

        // Notehead at insert X
        ghostHead.style.left = (ghostX - 6) + 'px'
        ghostHead.style.top  = (trackY - 4) + 'px'

        // Label badge
        ghostLbl.style.left  = (ghostX + 14) + 'px'
        ghostLbl.style.top   = (trackY - 8) + 'px'
        ghostLbl.textContent = `${letter}${acc}${oct}`

        ghost.style.display = 'block'
      })
      blocksEl.addEventListener('mouseleave', () => { ghost.style.display = 'none' })

      // ── Ctrl+mousedown: select/deselect a note (mousedown = fiable sur macOS) ──
      blocksEl.addEventListener('mousedown', e => {
        // Start rubber-band (only in select mode, no Ctrl)
        if (_staffPaletteMode === 'select' && !e.ctrlKey && !e.metaKey) {
          if (e.target.closest('.bchip-mute,.bchip-del,.bchip-resize,.bchip-top')) return
          const rect = blocksEl.getBoundingClientRect()
          const relX = e.clientX - rect.left, relY = e.clientY - rect.top
          _rubber = { selBoxEl: selBox, blocksElRect: rect,
                      startX: relX, startY: relY, trackId: track.id }
          selBox.style.left = relX + 'px'; selBox.style.top = relY + 'px'
          selBox.style.width = '0'; selBox.style.height = '0'
          selBox.style.display = 'block'
          return
        }
        if (!(e.ctrlKey || e.metaKey)) return
        if (e.target.closest('.bchip-mute,.bchip-del,.bchip-resize,.bchip-top')) return
        e.preventDefault()   // empêche contextmenu macOS + sélection texte
        const rect = blocksEl.getBoundingClientRect()
        const relX = e.clientX - rect.left
        const relY = e.clientY - rect.top
        if (relY < 18) return
        const measure = Math.max(1, Math.floor(relX / MEASURE_WIDTH) + 1)
        const block = S.blocks.find(b =>
          b.trackId === track.id && b.measure <= measure && (b.measure + b.measures - 1) >= measure
        )
        if (!block) { _selectedNotes = []; return }
        const chipOffsetX = relX - (block.measure - 1) * MEASURE_WIDTH
        const tokenIdx = findNoteAtPos(block, chipOffsetX, relY)
        if (tokenIdx !== null) {
          const existIdx = _selectedNotes.findIndex(s => s.blockId === block.id && s.tokenIdx === tokenIdx)
          if (existIdx >= 0) {
            _selectedNotes.splice(existIdx, 1)
            toast('✗ Désélectionné', 800)
          } else {
            _selectedNotes = [{ blockId: block.id, tokenIdx }]  // single select
            const tokens = (block.staffNotes||'').trim().split(/\s+/).filter(Boolean)
            const t = tokens[tokenIdx] || ''
            const noteName = t.split(':')[1] || '?'
            toast(`♩ ${noteName} sélectionné — ↑↓ pitch  ←→ déplacer`, 1800)
          }
        }
        // Note: ne pas vider _selectedNotes si clic manqué (garde la sélection active)
        refreshStaffChip(block)
      })

      // ── Click to place note (Ctrl already handled by mousedown) ──
      blocksEl.addEventListener('click', e => {
        if (_dragBlockId || _chipDragging || _resizing) return
        if (e.ctrlKey || e.metaKey) return  // handled by mousedown
        if (_staffPaletteMode === 'select') return  // select mode: no note placement
        if (e.target.closest('.bchip-mute,.bchip-del,.bchip-resize')) return
        if (e.target.closest('.bchip-top')) return
        const rect = blocksEl.getBoundingClientRect()
        const relX = e.clientX - rect.left
        const relY = e.clientY - rect.top
        if (relY < 18) return

        const measure = Math.max(1, Math.floor(relX / MEASURE_WIDTH) + 1)
        let block = S.blocks.find(b =>
          b.trackId === track.id && b.measure <= measure && (b.measure + b.measures - 1) >= measure
        )

        if (!block) {
          block = { id:'b'+BID++, type:'staff-bloc', trackId:track.id,
            measure, measures:1, name:'Staff', notes:'', chords:'',
            lyrics:'', tempo:S.tempo, key:S.key, muted:false,
            fretDots:[], staffNotes:'' }
          S.blocks.push(block)
          render()
        }
        // Check capacity before inserting
        const clickBpm = parseInt((S.timeSign||'4/4').split('/')[0]) || 4
        const { totalBeats: usedBeats } = parseStaffTokens(block.staffNotes, clickBpm)
        const blockCapacity = block.measures * clickBpm
        if (usedBeats >= blockCapacity) {
          toast('⚠ Bloc plein — agrandissez (⤢) ou créez un nouveau bloc', 2500)
          return
        }
        const clickScale = (block && _expandedStaff.has(block.id)) ? 2 : 1
        const [letter, oct] = staffYToPitch(relY, clickScale)
        const dur = _spalDur || 'q'
        const acc = _spalAcc || ''
        const token = `${dur}:${letter}${acc}${oct}`
        _spalAcc = ''
        block.staffNotes = block.staffNotes ? block.staffNotes + ' ' + token : token
        _spalBlock = block
        refreshStaffChip(block)
        // Sync palette display if open
        const spalBody = $('spal-body')
        if (spalBody) {
          const disp = spalBody.querySelector('.ctx-staff-display')
          if (disp) disp.textContent = staffFormat(block.staffNotes)
          spalBody.querySelectorAll('.ctx-staff-btn.acc-sel').forEach(b => b.classList.remove('acc-sel'))
        }
      })

      blocksEl.addEventListener('contextmenu', e => e.preventDefault())

      // ── Rubber-band mouseup: finalize selection ──
      // Rubber-band finalization handled by global mouseup in initResizeHandlers
    }

    // Render blocks on this track
    if (track.type === 'live-memo') {
      buildLiveMemoLanes(track, blocksEl)
    } else {
      const trackBlocks = S.blocks.filter(b => b.trackId === track.id)
      trackBlocks.forEach(block => {
        const chip = buildBlockChip(block, track)
        blocksEl.appendChild(chip)
      })
    }

    row.appendChild(blocksEl)
    return row
  }

  /* ═══════════════════════════════════════════════════════════
     BLOCK CHIP
  ═══════════════════════════════════════════════════════════ */

  function makeResizeHandle(block) {
    const h = el('div', 'bchip-resize')
    h.title = 'Étirer'
    h.addEventListener('mousedown', e => {
      e.stopPropagation()
      e.preventDefault()
      h.classList.add('resizing')
      _resizing = { blockId: block.id, startX: e.clientX, startMeasures: block.measures, handle: h }
    })
    return h
  }

  let _dragBlockId   = null   // id of block chip being dragged
  let _chipDragging  = false  // guard to suppress click after drag
  let _dragTrackId   = null   // id of track row being reordered
  let _resizing      = null   // { blockId, startX, startMeasures, handle }
  let _selectedNotes  = []     // [{ blockId, tokenIdx }] — multi-sélection
  let _staffPaletteMode = 'draw'  // 'draw' | 'select'
  const _expandedStaff = new Set()   // IDs de chips Staff agrandis
  let _audioCtx = null               // Web Audio API context (lazy)
  let _rubber   = null               // { selBoxEl, blocksElRect, startX, startY, trackId }

  // ── Note selection helpers ───────────────────────────────────
  const _DIATONIC = ['C','D','E','F','G','A','B']

  function shiftNotePitch(note, dir) {
    // dir: +1 = up (higher pitch), -1 = down
    const m = note.match(/^([A-G])([#b]?)(\d+)$/)
    if (!m) return note
    let oct = parseInt(m[3])
    let idx = _DIATONIC.indexOf(m[1])
    idx += dir
    if (idx >= 7) { idx -= 7; oct++ }
    if (idx < 0)  { idx += 7; oct-- }
    oct = Math.max(2, Math.min(7, oct))
    return `${_DIATONIC[idx]}${oct}`  // strip accidental on step move (standard)
  }

  function findNoteAtPos(block, chipOffsetX, trackRelY) {
    const beatsPerMeasure = parseInt((S.timeSign||'4/4').split('/')[0]) || 4
    const numMeasures = Math.max(1, Math.min(4, block.measures || 1))
    const keySig = keySigInfo(S.key || 'C')
    const HEAD_W = 18 + keySig.count * 6 + 12 + 4
    const chipW  = block.measures * MEASURE_WIDTH - 6
    const MEAS_W = (chipW - HEAD_W) / numMeasures
    const staffScale = _expandedStaff.has(block.id) ? 2 : 1
    const svgX = chipOffsetX - 2   // correction border chip 2px
    const svgY = (trackRelY - 18) / staffScale
    const { notes } = parseStaffTokens(block.staffNotes, beatsPerMeasure)
    let best = null, bestDist = 24   // rayon élargi à 24px
    notes.forEach((n, idx) => {
      if (n.measureIdx >= numMeasures || n.note === 'Rest') return
      const cx = HEAD_W + n.measureIdx * MEAS_W + (n.beatInMeasure / beatsPerMeasure) * MEAS_W + 10
      const cy = STAFF_PITCH_Y[n.note] ?? 36
      const d  = Math.sqrt((svgX - cx) ** 2 + (svgY - cy) ** 2)
      if (d < bestDist) { bestDist = d; best = idx }
    })
    return best
  }

  /* ── LIVE MEMO lanes ────────────────────────────────────── */
  function buildLiveMemoLanes(track, blocksEl) {
    ['A','B'].forEach(sub => {
      const lane = el('div', 'memo-lane')

      // ── Left controls: [A/B] [⏺ REC] [▶ PLAY] [⏹ STOP] ──────
      const ctrl = el('div', 'memo-lane-ctrl')
      ctrl.appendChild(el('div', 'memo-lane-lbl', sub))

      // Record button
      const recBtn = el('button', 'memo-btn rec')
      recBtn.textContent = '⏺'
      recBtn.title = `Enregistrer canal ${sub}`
      recBtn.addEventListener('click', e => {
        e.stopPropagation()
        if (_memoRec && _memoRec.sub === sub && _memoRec.trackId === track.id) {
          stopMemoRecording()
        } else {
          if (_memoRec) stopMemoRecording()
          startMemoRecording(track.id, sub, recBtn)
        }
      })
      ctrl.appendChild(recBtn)

      // Play-all button (plays all clips of this sub in sequence)
      const playAllBtn = el('button', 'memo-btn play')
      playAllBtn.textContent = '▶'
      playAllBtn.title = `Lire canal ${sub}`
      playAllBtn.addEventListener('click', e => {
        e.stopPropagation()
        const clips = S.blocks
          .filter(b => b.trackId === track.id && b.subTrack === sub && b.type === 'memo-clip')
          .sort((a,b) => a.measure - b.measure)
        if (!clips.length) { toast('Canal vide', 1000); return }
        playMemoBlock(clips[0], playAllBtn)
      })
      ctrl.appendChild(playAllBtn)

      // Stop button
      const stopBtn = el('button', 'memo-btn stop')
      stopBtn.textContent = '⏹'
      stopBtn.title = 'Stop'
      stopBtn.addEventListener('click', e => {
        e.stopPropagation()
        if (_memoRec) stopMemoRecording()
        if (_memoPlay) {
          try { _memoPlay.source.stop() } catch(err) {}
          if (_memoPlay.btnEl) { _memoPlay.btnEl.textContent = '▶'; _memoPlay.btnEl.classList.remove('active') }
          _memoPlay = null
        }
      })
      ctrl.appendChild(stopBtn)
      lane.appendChild(ctrl)

      // ── Clips scroll area ─────────────────────────────────────
      const clipsArea = el('div', 'memo-clips-area')
      const clipsInner = el('div', 'memo-clips-inner')
      clipsInner.style.width = (MEASURES * MEASURE_WIDTH) + 'px'

      S.blocks
        .filter(b => b.trackId === track.id && b.subTrack === sub && b.type === 'memo-clip')
        .sort((a,b) => a.measure - b.measure)
        .forEach(block => clipsInner.appendChild(buildMemoChip(block)))

      clipsArea.appendChild(clipsInner)
      lane.appendChild(clipsArea)
      blocksEl.appendChild(lane)
    })
  }

  function buildMemoChip(block) {
    const chip = el('div', 'memo-chip')
    chip.dataset.blockId = block.id
    chip.style.left  = ((block.measure - 1) * MEASURE_WIDTH) + 'px'
    chip.style.width = Math.max(110, block.measures * MEASURE_WIDTH - 4) + 'px'

    // ── TOP BAR : nom éditable centré ──────────────────────────
    const topBar = el('div', 'memo-chip-top-bar')
    const nameInput = el('input', 'memo-chip-name')
    nameInput.type = 'text'
    nameInput.value = block.name || ''
    nameInput.placeholder = 'Nom du mémo…'
    nameInput.addEventListener('click',  e => e.stopPropagation())
    nameInput.addEventListener('change', () => { block.name = nameInput.value })
    topBar.appendChild(nameInput)
    chip.appendChild(topBar)

    // ── WAVEFORM + PLAYHEAD ────────────────────────────────────
    const waveArea = el('div', 'memo-chip-wave-area')
    waveArea.appendChild(drawMemoWaveform(block.waveformData))
    const playhead = el('div', 'memo-playhead')
    waveArea.appendChild(playhead)
    chip.appendChild(waveArea)

    // ── BOTTOM BAR : durée | ▶ | ✕ ────────────────────────────
    const bar = el('div', 'memo-chip-bar')
    const dur = el('span', 'memo-chip-dur', block.duration ? fmtDuration(block.duration) : '…')

    const playBtn = el('button', 'memo-chip-play', '▶')
    playBtn.title = 'Lire'
    playBtn.addEventListener('click', e => { e.stopPropagation(); playMemoBlock(block, playBtn) })

    const delBtn = el('button', 'memo-chip-del', '✕')
    delBtn.title = 'Supprimer'
    delBtn.addEventListener('click', e => { e.stopPropagation(); deleteMemoBlock(block.id) })

    bar.appendChild(dur); bar.appendChild(playBtn); bar.appendChild(delBtn)
    chip.appendChild(bar)
    return chip
  }

  function drawMemoWaveform(data) {
    const NS  = 'http://www.w3.org/2000/svg'
    const svg = document.createElementNS(NS, 'svg')
    svg.setAttribute('preserveAspectRatio', 'none')
    svg.setAttribute('viewBox', '0 0 100 24')

    const mk = (tag, attrs) => {
      const el = document.createElementNS(NS, tag)
      for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, v)
      svg.appendChild(el); return el
    }

    if (!data || !data.length) {
      mk('line', {x1:0,y1:12,x2:100,y2:12,
        stroke:'rgba(96,165,250,0.3)','stroke-width':0.8,'stroke-dasharray':'4 3'})
      return svg
    }

    const mid = 12, amp = 10, pts = data.length

    // Build coordinate arrays
    const fwd = data.map((v,i) => `${(i*100/(pts-1)).toFixed(1)},${(mid-v*amp).toFixed(1)}`)
    const bwd = data.slice().reverse().map((v,i) => `${((pts-1-i)*100/(pts-1)).toFixed(1)},${(mid+v*amp).toFixed(1)}`)

    // Filled envelope (closed path)
    mk('path', {
      d: `M0,${mid} L${fwd.join(' L')} L${bwd.join(' L')} Z`,
      fill:'rgba(96,165,250,0.2)', stroke:'none'
    })

    // Top edge — bright
    mk('path', {
      d: `M0,${mid} L${fwd.join(' L')}`,
      stroke:'rgba(96,165,250,0.95)', 'stroke-width':1.2, fill:'none', 'stroke-linejoin':'round'
    })

    // Bottom edge — dimmer
    mk('path', {
      d: `M0,${mid} L${data.map((v,i) => `${(i*100/(pts-1)).toFixed(1)},${(mid+v*amp).toFixed(1)}`).join(' L')}`,
      stroke:'rgba(96,165,250,0.5)', 'stroke-width':0.8, fill:'none', 'stroke-linejoin':'round'
    })

    return svg
  }

  function buildMemoTextChip(block) {
    const chip = el('div', 'block-chip memo-text-chip')
    chip.dataset.blockId = block.id
    chip.draggable = true
    chip.style.left  = ((block.measure - 1) * MEASURE_WIDTH) + 'px'
    chip.style.width = (block.measures * MEASURE_WIDTH - 4) + 'px'

    const muteLabel = block.muted ? '🔇 MUTED' : '📝'
    chip.innerHTML = `
      <div class="bchip-top">
        <button class="bchip-mute" title="Mute">${muteLabel}</button>
        <button class="bchip-del"  title="Supprimer">✕</button>
      </div>
    `
    const ta = document.createElement('textarea')
    ta.value       = block.notes || ''
    ta.placeholder = 'Notes, idées, paroles…'
    ta.rows = 3
    ta.addEventListener('click',  e => e.stopPropagation())
    ta.addEventListener('change', () => { block.notes = ta.value })
    ta.addEventListener('input',  () => { block.notes = ta.value })
    chip.appendChild(ta)

    chip.querySelector('.bchip-mute').addEventListener('click', e => { e.stopPropagation(); toggleMute(block.id) })
    chip.querySelector('.bchip-del').addEventListener('click',  e => { e.stopPropagation(); quickDeleteBlock(block.id) })
    chip.addEventListener('dragstart', e => {
      _dragBlockId = block.id; _chipDragging = true
      e.dataTransfer.effectAllowed = 'move'
      e.dataTransfer.setData('application/block-id', block.id)
      e.dataTransfer.setData('text/plain', '')
      chip.classList.add('dragging')
    })
    chip.addEventListener('dragend', () => {
      chip.classList.remove('dragging'); _dragBlockId = null
      setTimeout(() => { _chipDragging = false }, 0)
    })
    chip.appendChild(makeResizeHandle(block))
    return chip
  }

  function buildBlockChip(block, track) {
    if (block.type === 'memo-clip') return el('div')  // handled by buildLiveMemoLanes
    if (track && track.type === 'lyrics')    return buildLyricsChip(block)
    if (track && track.type === 'fretboard') return buildFretboardChip(block)
    if (track && track.type === 'staff')     return buildStaffChip(block)
    if (track && track.type === 'memos')     return buildMemoTextChip(block)
    const def = BLOCK_DEFS[block.type] || { label: block.type, icon:'◼', color:'#475569' }
    const chip = el('div', 'block-chip')
    chip.dataset.blockId = block.id
    chip.draggable = true
    if (block.id === S.selectedBlockId) chip.classList.add('selected')
    if (block.muted) chip.classList.add('muted')

    chip.style.left  = ((block.measure - 1) * MEASURE_WIDTH) + 'px'
    chip.style.width = (block.measures * MEASURE_WIDTH - 4) + 'px'
    chip.classList.add(`bloc-${block.type}`)

    // Top bar: mute (center) + delete (right)
    const muteLabel = block.muted ? '🔇 MUTED' : '🔇 Mute'
    chip.innerHTML = `
      <div class="bchip-top">
        <button class="bchip-mute" title="Mute / Unmute block">${muteLabel}</button>
        <button class="bchip-del"  title="Delete block">✕</button>
      </div>
      <div class="bchip-main">
        <span class="bchip-icon">${def.icon}</span>
        <span class="bchip-label">${esc(block.name || def.label)}</span>
        <span class="bchip-dur">${block.measures}m</span>
      </div>
    `

    // Mute button
    chip.querySelector('.bchip-mute').addEventListener('click', e => {
      e.stopPropagation()
      toggleMute(block.id)
    })

    // Quick delete button
    chip.querySelector('.bchip-del').addEventListener('click', e => {
      e.stopPropagation()
      quickDeleteBlock(block.id)
    })

    // Drag to move / switch track
    chip.addEventListener('dragstart', e => {
      _dragBlockId  = block.id
      _chipDragging = true
      e.dataTransfer.effectAllowed = 'move'
      e.dataTransfer.setData('application/block-id', block.id)
      // Prevent palette type from leaking through
      e.dataTransfer.setData('text/plain', '')
      chip.classList.add('dragging')
    })
    chip.addEventListener('dragend', () => {
      chip.classList.remove('dragging')
      _dragBlockId = null
      setTimeout(() => { _chipDragging = false }, 0)
    })

    // Click to open detail panel (not after drag)
    chip.addEventListener('click', () => {
      if (_chipDragging) return
      openBlockDetail(block.id)
    })

    chip.appendChild(makeResizeHandle(block))
    return chip
  }

  function buildLyricsChip(block) {
    const def = BLOCK_DEFS[block.type] || { label: block.type, icon:'🎤', color:'#4b5563' }
    const chip = el('div', 'block-chip lyrics-chip')
    chip.dataset.blockId = block.id
    chip.draggable = true
    if (block.id === S.selectedBlockId) chip.classList.add('selected')

  // cellSize: px per cell (default 13 for compact, 15 for center display)
  // rows: fret rows to show
  function buildMiniChordDiagram(block, cellSize = 13, rows = 4) {
    const dots = block.fretDots || []
    const STRINGS = ['E','A','D','G','B','e']
    const activeFrets = dots.map(d => d.f)
    const startFret = activeFrets.length ? Math.max(1, Math.min(...activeFrets)) : 1

    const diag = el('div', 'mini-chord-diag')

    // String-name header
    const head = el('div', 'mini-chord-head')
    STRINGS.forEach(s => {
      const h = el('span', 'mini-chord-str-hdr', s)
      h.style.width = cellSize + 'px'
      head.appendChild(h)
    })
    diag.appendChild(head)

    // Fret rows
    for (let f = startFret; f < startFret + rows; f++) {
      const frow = el('div', 'mini-chord-frow')
      for (let s = 1; s <= 6; s++) {
        const cell = el('span', 'mini-chord-cell')
        cell.style.width  = cellSize + 'px'
        cell.style.height = (cellSize - 2) + 'px'
        if (dots.some(d => d.f === f && d.s === s)) {
          const dot = el('span', 'mini-chord-dot')
          const ds = Math.round(cellSize * 0.55)
          dot.style.width = ds + 'px'; dot.style.height = ds + 'px'
          cell.appendChild(dot)
        }
        frow.appendChild(cell)
      }
      if (f === startFret && startFret > 1) {
        const fn = el('span', 'mini-chord-fnum', String(startFret))
        frow.appendChild(fn)
      }
      diag.appendChild(frow)
    }
    return diag
  }

  function buildStaffSVG(block, w, h) {
    const scale = h / 74              // 1.0 normal, 2.0 expanded
    const LINE_Y = [14,24,34,44,54].map(y => y * scale)
    const NS = 'http://www.w3.org/2000/svg'
    const svg = document.createElementNS(NS,'svg')
    svg.setAttribute('width',w); svg.setAttribute('height',h)
    svg.setAttribute('viewBox',`0 0 ${w} ${h}`)

    const mk = (tag,attrs,parent) => {
      const el = document.createElementNS(NS,tag)
      for(const [k,v] of Object.entries(attrs)) el.setAttribute(k,v)
      if(parent) parent.appendChild(el)
      return el
    }
    const line = (x1,y1,x2,y2,op=0.30,w=1) =>
      mk('line',{x1,y1,x2,y2,stroke:`rgba(255,255,255,${op})`,'stroke-width':w},svg)
    const text = (x,y,str,sz=11,op=0.7,anchor='middle') => {
      const t = mk('text',{x,y,'font-size':sz,fill:`rgba(255,255,255,${op})`,'text-anchor':anchor,'font-family':'serif'},svg)
      t.textContent = str; return t
    }

    // ── Layout ──────────────────────────────────────────────────
    const beatsPerMeasure = parseInt((S.timeSign||'4/4').split('/')[0]) || 4
    const numMeasures     = Math.max(1, Math.min(4, block.measures || 1))
    const keySig          = keySigInfo(S.key || 'C')

    const CLEF_W    = 18
    const KEYSIG_W  = keySig.count * 6
    const TIMESIG_W = 12
    const HEAD_W    = CLEF_W + KEYSIG_W + TIMESIG_W + 4
    const NOTE_AREA = w - HEAD_W
    const MEAS_W    = NOTE_AREA / numMeasures

    // ── Staff lines ──────────────────────────────────────────────
    LINE_Y.forEach(y => line(0,y,w,y))

    // ── Treble clef — font-size proportionnel mais plafonné pour chips étroits ──
    const clefFontSize = Math.min(Math.round(54 * scale), 68)
    const clefY = Math.round(LINE_Y[4] + clefFontSize * 0.18)
    const clef = mk('text',{x:1,y:clefY,'font-size':clefFontSize,fill:'rgba(255,255,255,0.70)','font-family':'serif'},svg)
    clef.textContent = '𝄞'

    // ── Key signature ─────────────────────────────────────────────
    if (keySig.count > 0) {
      const sym = keySig.type === '#' ? '♯' : '♭'
      keySig.yPos.forEach((y, i) => {
        const t = mk('text',{x: CLEF_W + i*6 + 3, y: Math.round(y*scale)+4, 'font-size':9,
          fill:'rgba(255,255,255,0.90)', 'text-anchor':'middle','font-family':'serif'}, svg)
        t.textContent = sym
      })
    }

    // ── Time signature ────────────────────────────────────────────
    const [tsTop, tsBot] = (S.timeSign||'4/4').split('/')
    const tsX = CLEF_W + KEYSIG_W + 8
    const tsFontSize = Math.min(Math.round(12 * scale), 20)
    const tTop = mk('text',{x:tsX,y:LINE_Y[1]+Math.round(3*scale),'font-size':tsFontSize,fill:'rgba(255,255,255,0.85)',
      'text-anchor':'middle','font-weight':'bold','font-family':'sans-serif'},svg)
    tTop.textContent = tsTop || '4'
    const tBot = mk('text',{x:tsX,y:LINE_Y[3]+Math.round(4*scale),'font-size':tsFontSize,fill:'rgba(255,255,255,0.85)',
      'text-anchor':'middle','font-weight':'bold','font-family':'sans-serif'},svg)
    tBot.textContent = tsBot || '4'

    // ── Barlines ──────────────────────────────────────────────────
    for (let i = 1; i < numMeasures; i++) {
      const bx = HEAD_W + i * MEAS_W
      line(bx, LINE_Y[0], bx, LINE_Y[4], 0.75, 1.5)
    }
    // Final double barline
    line(w-3, LINE_Y[0], w-3, LINE_Y[4], 0.75, 1.5)
    line(w-1, LINE_Y[0], w-1, LINE_Y[4], 0.75, 3)

    // ── Parse tokens ──────────────────────────────────────────────
    const { notes, totalBeats } = parseStaffTokens(block.staffNotes, beatsPerMeasure)
    const capacity = numMeasures * beatsPerMeasure

    if (totalBeats > capacity + 0.01) {
      const warn = mk('text',{x:w-4,y:10,'font-size':9,fill:'rgba(255,180,50,0.9)',
        'text-anchor':'end','font-family':'sans-serif'},svg)
      warn.textContent = '!'
    }

    // ══ PASS 1 : layout + beam groups ═════════════════════════════
    const STEM_LEN = 18 * scale
    const BEAM_H   = Math.max(3, Math.round(3.5 * scale))
    const BEAM_GAP = Math.max(2, Math.round(3 * scale))

    const layout = []       // one entry per token
    const beamGroups = []
    let curGrp = null

    notes.forEach((n, idx) => {
      if (n.measureIdx >= numMeasures) { layout.push(null); return }
      const cx  = HEAD_W + n.measureIdx * MEAS_W + (n.beatInMeasure / beatsPerMeasure) * MEAS_W + 10
      const cy  = (STAFF_PITCH_Y[n.note] ?? (n.note === 'Rest' ? 34 : 36)) * scale
      const isRest    = n.note === 'Rest' || n.note === 'r'
      const isTriplet = n.dur === 'qt' || n.dur === 'et'
      const baseDur   = isTriplet ? n.dur.slice(0, -1) : n.dur
      const beamable  = !isRest && (baseDur === 'e' || baseDur === 's')
      const isSel     = _selectedNotes.some(s => s.blockId === block.id && s.tokenIdx === idx)

      const entry = { n, idx, cx, cy, isRest, baseDur, beamable, isTriplet, isSel, inGroup: false,
                      stemUp: cy >= 34 * scale, stemX: 0, stemEndY: 0 }
      layout.push(entry)

      if (beamable) {
        const beatGrp = Math.floor(n.beatInMeasure)
        if (!curGrp || curGrp.measureIdx !== n.measureIdx || curGrp.beatGrp !== beatGrp || curGrp.isTriplet !== isTriplet) {
          curGrp = { measureIdx: n.measureIdx, beatGrp, isTriplet, entries: [entry] }
          beamGroups.push(curGrp)
        } else {
          curGrp.entries.push(entry)
        }
      } else { curGrp = null }
    })

    // Force uniform stem direction in beam groups with 2+ notes
    beamGroups.forEach(grp => {
      if (grp.entries.length < 2) return
      const avgCy = grp.entries.reduce((s, e) => s + e.cy, 0) / grp.entries.length
      const up = avgCy >= 34 * scale
      grp.entries.forEach(e => { e.inGroup = true; e.stemUp = up })
    })

    // Finalise stemX / stemEndY
    layout.forEach(e => {
      if (!e) return
      e.stemX    = e.stemUp ? e.cx + 5 : e.cx - 5
      e.stemEndY = e.stemUp ? e.cy - STEM_LEN : e.cy + STEM_LEN
    })

    // ══ PASS 2 : draw notes ════════════════════════════════════════
    layout.forEach(e => {
      if (!e) return
      const { n, cx, cy, isRest, baseDur, isSel, inGroup, stemUp, stemX, stemEndY } = e
      const filled = baseDur !== 'w' && baseDur !== 'h'

      // Ledger lines
      if (!isRest) {
        const bot = LINE_Y[LINE_Y.length - 1]
        const top = LINE_Y[0]
        if (cy >= bot + 5) for (let ly = bot + 10*scale; ly <= cy + 3; ly += 10*scale) line(cx-7,ly,cx+7,ly,0.65)
        if (cy <= top - 5) for (let ly = top - 10*scale; ly >= cy - 3; ly -= 10*scale) line(cx-7,ly,cx+7,ly,0.65)
      }

      if (isRest) {
        if (baseDur === 'w') {
          mk('rect',{x:cx-6,y:LINE_Y[1],width:12,height:5,fill:'rgba(255,255,255,0.9)'},svg)
        } else if (baseDur === 'h') {
          mk('rect',{x:cx-6,y:LINE_Y[2]-5,width:12,height:5,fill:'none',stroke:'rgba(255,255,255,0.9)','stroke-width':1.2},svg)
        } else {
          const zx=cx-4, zy=LINE_Y[1]+2
          mk('path',{d:`M${zx},${zy} L${zx+8},${zy} L${zx},${zy+8} L${zx+8},${zy+8}`,
            stroke:'rgba(255,255,255,0.9)','stroke-width':1.5,fill:'none','stroke-linecap':'round'},svg)
        }
        return
      }

      // Accidental
      const accM = n.note.match(/[#b]/)
      if (accM) {
        const at = mk('text',{x:cx-9,y:cy+4,'font-size':9,fill:'rgba(255,255,255,0.9)',
          'text-anchor':'middle','font-family':'serif'},svg)
        at.textContent = accM[0]==='#' ? '♯' : '♭'
      }

      // Notehead
      const noteColor = isSel ? '#4ade80' : 'rgba(255,255,255,0.95)'
      const ell = mk('ellipse',{cx,cy,rx:5,ry:3.5,transform:`rotate(-15,${cx},${cy})`},svg)
      if (filled) ell.setAttribute('fill', noteColor)
      else { ell.setAttribute('fill','none'); ell.setAttribute('stroke',noteColor); ell.setAttribute('stroke-width','1.5') }

      // Selection ring — scaled + more visible
      if (isSel) mk('ellipse',{cx,cy,rx:Math.round(9*scale),ry:Math.round(7*scale),
        transform:`rotate(-15,${cx},${cy})`,fill:'none',stroke:'#4ade80',
        'stroke-width':'2','stroke-dasharray':`${Math.round(4*scale)} ${Math.round(2*scale)}`},svg)

      // Dot
      if (n.dotted) mk('circle',{cx:cx+8,cy:cy-1,r:1.5,fill:'rgba(255,255,255,0.9)'},svg)

      // Stem
      if (baseDur !== 'w') line(stemX, cy, stemX, stemEndY, 0.95)

      // Flags — seulement pour les notes NON beamées
      if (!inGroup) {
        const drawFlag = (fy0, vOff) => {
          const s = scale
          const d = stemUp
            ? `M${stemX},${fy0+vOff} C${stemX+11},${fy0+vOff+s} ${stemX+10},${fy0+vOff+8*s} ${stemX+1},${fy0+vOff+11*s} C${stemX+5},${fy0+vOff+6*s} ${stemX+2},${fy0+vOff+2*s} ${stemX},${fy0+vOff} Z`
            : `M${stemX},${fy0-vOff} C${stemX-11},${fy0-vOff-s} ${stemX-10},${fy0-vOff-8*s} ${stemX-1},${fy0-vOff-11*s} C${stemX-5},${fy0-vOff-6*s} ${stemX-2},${fy0-vOff-2*s} ${stemX},${fy0-vOff} Z`
          mk('path',{d,fill:'rgba(255,255,255,0.95)',stroke:'none'},svg)
        }
        if (baseDur === 'e' || baseDur === 's' || n.dur === 'et') {
          drawFlag(stemEndY, 0)
          if (baseDur === 's') drawFlag(stemEndY, stemUp ? 7*scale : -7*scale)
        }
      }
    })

    // ══ PASS 3 : draw beams ════════════════════════════════════════
    beamGroups.forEach(grp => {
      if (grp.entries.length < 2) return
      const up = grp.entries[0].stemUp

      // Level beam: all stems reach the highest/lowest endpoint
      const targetY = up
        ? Math.min(...grp.entries.map(e => e.stemEndY))
        : Math.max(...grp.entries.map(e => e.stemEndY))

      // Redraw stems to reach the beam
      grp.entries.forEach(e => line(e.stemX, e.cy + (up ? -2 : 2), e.stemX, targetY + (up ? BEAM_H : -BEAM_H), 0.95, 1.5))

      const x1 = grp.entries[0].stemX - 1
      const x2 = grp.entries[grp.entries.length-1].stemX + 1
      const bw = x2 - x1 + 1

      // Bar 1 (croche/double-croche)
      const bar1Y = up ? targetY : targetY - BEAM_H
      mk('rect',{x:x1,y:bar1Y,width:bw,height:BEAM_H,fill:'rgba(255,255,255,0.95)',rx:0.5},svg)

      // Bar 2 (double-croche uniquement)
      if (grp.entries.some(e => e.baseDur === 's')) {
        const bar2Y = up ? bar1Y + BEAM_H + BEAM_GAP : bar1Y - BEAM_H - BEAM_GAP
        mk('rect',{x:x1,y:bar2Y,width:bw,height:BEAM_H,fill:'rgba(255,255,255,0.95)',rx:0.5},svg)
      }

      // Triplet bracket + "3"
      if (grp.isTriplet && grp.entries.length === 3) {
        const midX = (grp.entries[0].cx + grp.entries[2].cx) / 2
        const bY   = up ? bar1Y - 6 : bar1Y + BEAM_H + 6
        const sign = up ? -1 : 1
        mk('line',{x1:x1,y1:bY,x2:x1,y2:bY+sign*4,stroke:'rgba(255,255,255,0.75)','stroke-width':1},svg)
        mk('line',{x1:x1,y1:bY,x2:x2,y2:bY,stroke:'rgba(255,255,255,0.75)','stroke-width':1},svg)
        mk('line',{x1:x2,y1:bY,x2:x2,y2:bY+sign*4,stroke:'rgba(255,255,255,0.75)','stroke-width':1},svg)
        const t3 = mk('text',{x:midX,y:bY-sign*1,'font-size':8,fill:'rgba(255,255,255,0.85)',
          'text-anchor':'middle','font-family':'serif'},svg)
        t3.textContent = '3'
      }
    })

    return svg
  }

  // Map track-blocks Y → nearest [letter, octave] using SVG coordinate system
  // bchip-top = 18px, so SVG Y = relY - 18; STAFF_PITCH_Y step = 5px
  const _STAFF_PITCH_TABLE = [
    {l:'G',o:5,y:11},{l:'F',o:5,y:16},{l:'E',o:5,y:21},{l:'D',o:5,y:26},{l:'C',o:5,y:31},
    {l:'B',o:4,y:36},{l:'A',o:4,y:41},{l:'G',o:4,y:46},{l:'F',o:4,y:51},{l:'E',o:4,y:56},
    {l:'D',o:4,y:61},{l:'C',o:4,y:66},{l:'B',o:3,y:71},{l:'A',o:3,y:76},{l:'G',o:3,y:81},
  ]
  function staffYToPitch(relY, scale = 1) {
    const svgY = (relY - 18) / scale
    let best = _STAFF_PITCH_TABLE[0], bestD = Math.abs(svgY - best.y)
    for (const p of _STAFF_PITCH_TABLE) {
      const d = Math.abs(svgY - p.y)
      if (d < bestD) { bestD = d; best = p }
    }
    return [best.l, best.o]
  }
  function staffPitchToTrackY(letter, octave, scale = 1) {
    const key = `${letter}${octave}`
    return 18 + (STAFF_PITCH_Y[key] ?? 36) * scale
  }

  /* ── STAFF NOTE POPUP ────────────────────────────────────── */
  let _spBlock  = null
  let _spDur    = 'q'
  let _spAcc    = ''
  let _spOctave = 4

  function showStaffPopup(block, x, y, pitchHint) {
    _spBlock  = block
    _spDur    = 'q'
    _spAcc    = ''
    _spOctave = (pitchHint && pitchHint[1]) ? pitchHint[1] : 4
    const popup = $('staff-popup')

    popup.innerHTML = `
      <div class="sp-title">Saisie note — clic droit portée</div>
      <div id="sp-dur-row"  class="ctx-staff-row"></div>
      <div id="sp-acc-row"  class="ctx-staff-row"></div>
      <div id="sp-note-row" class="ctx-staff-row"></div>
      <div class="ctx-staff-row" style="justify-content:space-between">
        <button class="ctx-staff-btn" id="sp-rest-btn" title="Silence"></button>
        <button class="ctx-staff-btn" id="sp-bk-btn" title="Supprimer dernière note">⌫</button>
        <button class="btn danger" onclick="hideStaffPopup()" style="padding:2px 8px;font-size:11px">✕</button>
      </div>
    `
    // Inject rest SVG
    $('sp-rest-btn').innerHTML = NOTE_SVG.rest

    // Duration buttons
    const durRow = $('sp-dur-row')
    const durBtns = {}
    DURATIONS.forEach(({ k, sym, tip }) => {
      const btn = el('button', 'ctx-staff-btn' + (k === _spDur ? ' sel' : ''), sym)
      btn.title = tip
      btn.addEventListener('click', () => {
        _spDur = k
        Object.values(durBtns).forEach(b => b.classList.remove('sel'))
        btn.classList.add('sel')
      })
      durBtns[k] = btn
      durRow.appendChild(btn)
    })

    // Accidental buttons
    const accRow = $('sp-acc-row')
    const accBtns = {}
    const ACC = [{ k:'#', sym:'♯' },{ k:'b', sym:'♭' },{ k:'', sym:'♮' }]
    ACC.forEach(({ k, sym }) => {
      const btn = el('button', 'ctx-staff-btn' + (k === _spAcc ? ' acc-sel' : ''), sym)
      btn.addEventListener('click', () => {
        _spAcc = k
        Object.values(accBtns).forEach(b => b.classList.remove('acc-sel'))
        btn.classList.add('acc-sel')
      })
      accBtns[k] = btn
      accRow.appendChild(btn)
    })

    // Octave selector row
    const spOctRow = el('div', 'ctx-staff-row')
    spOctRow.id = 'sp-oct-row'
    $('sp-note-row').before(spOctRow)
    const spOctBtns = {}
    ;[3,4,5,6].forEach(oct => {
      const btn = el('button', 'ctx-staff-btn' + (oct === _spOctave ? ' sel' : ''), String(oct))
      btn.title = `Octave ${oct}`
      btn.addEventListener('click', () => {
        _spOctave = oct
        Object.values(spOctBtns).forEach(b => b.classList.remove('sel'))
        btn.classList.add('sel')
      })
      spOctBtns[oct] = btn; spOctRow.appendChild(btn)
    })
    const spOctLbl = el('span', '', 'oct')
    spOctLbl.style.cssText = 'font-size:9px;opacity:0.5;margin-left:3px;align-self:center'
    spOctRow.appendChild(spOctLbl)

    // Note buttons  (pitch hint pre-selects the note letter)
    const noteRow = $('sp-note-row')
    const hintLetter = pitchHint ? pitchHint[0] : null
    ;['C','D','E','F','G','A','B'].forEach(n => {
      const btn = el('button', 'ctx-staff-btn', n)
      if (hintLetter === n) btn.classList.add('sel')
      btn.addEventListener('click', () => {
        staffAppendToBlock(_spBlock, n)
        noteRow.querySelectorAll('.ctx-staff-btn').forEach(b => b.classList.remove('sel'))
        btn.classList.add('sel')
      })
      noteRow.appendChild(btn)
    })

    // Backspace
    $('sp-bk-btn').addEventListener('click', () => {
      const tokens = (_spBlock.staffNotes || '').trim().split(/\s+/).filter(Boolean)
      tokens.pop()
      _spBlock.staffNotes = tokens.join(' ')
      refreshStaffChip(_spBlock)
    })

    // Rest
    $('sp-rest-btn').addEventListener('click', () => {
      staffAppendToBlock(_spBlock, 'Rest')
    })

    // Position popup near click but keep on screen
    const pw = 230, ph = 160
    popup.style.left = Math.min(x, window.innerWidth  - pw - 8) + 'px'
    popup.style.top  = Math.min(y, window.innerHeight - ph - 8) + 'px'
    popup.classList.add('open')
  }

  function hideStaffPopup() {
    $('staff-popup').classList.remove('open')
    _spBlock = null
  }

  function staffAppendToBlock(block, noteName) {
    if (!block) return
    const token = noteName === 'Rest'
      ? `${_spDur}:Rest`
      : `${_spDur}:${noteName}${_spAcc}${_spOctave}`
    _spAcc = ''
    block.staffNotes = block.staffNotes ? block.staffNotes + ' ' + token : token
    refreshStaffChip(block)
    // Reset acc buttons
    const popup = $('staff-popup')
    if (popup) popup.querySelectorAll('.ctx-staff-btn.acc-sel').forEach(b => b.classList.remove('acc-sel'))
  }

  function rebuildStaffChip(block) {
    const old = document.querySelector(`.block-chip[data-block-id="${block.id}"]`)
    if (!old) { render(); return }
    const newChip = buildStaffChip(block)
    old.replaceWith(newChip)
    const row = newChip.closest('.track-row')
    if (row) row.classList.toggle('has-expanded',
      S.blocks.some(b => b.trackId === block.trackId && _expandedStaff.has(b.id)))
  }

  function refreshStaffChip(block) {
    const chip = document.querySelector(`.block-chip[data-block-id="${block.id}"]`)
    if (!chip) { render(); return }
    const oldSvg = chip.querySelector('svg')
    const chipW = block.measures * MEASURE_WIDTH - 6
    const newSvg = buildStaffSVG(block, chipW, 74)
    if (oldSvg) chip.replaceChild(newSvg, oldSvg)
    else chip.appendChild(newSvg)
    // Sync left panel display if open
    const display = document.querySelector('.ctx-staff-display')
    if (display) display.textContent = staffFormat(block.staffNotes)
  }

  function toggleMute(id) {
    const block = S.blocks.find(b => b.id === id)
    if (!block) return
    block.muted = !block.muted
    render()
    toast(block.muted ? '🔇 Muted' : '🔊 Unmuted')
  }

  function quickDeleteBlock(id) {
    S.blocks = S.blocks.filter(b => b.id !== id)
    if (S.selectedBlockId === id) { S.selectedBlockId = null; closePanel() }
    render()
    toast('Block deleted')
  }

  /* ═══════════════════════════════════════════════════════════
     TRACKS CRUD
  ═══════════════════════════════════════════════════════════ */
  let _pendingTrackType = null
  let _lastDefaultName  = ''

  function showAddTrack() {
    _pendingTrackType = null
    _lastDefaultName  = ''
    const grid = $('track-type-grid')
    grid.innerHTML = ''
    const nameInput = $('add-track-name')
    if (nameInput) nameInput.value = ''

    const SECTIONS = [
      { group:'main', label:'Piste principale' },
      { group:'sub',  label:'Sous-pistes  (sous Structure)' },
      { group:'free', label:'Pistes libres' },
    ]

    SECTIONS.forEach(({ group, label }) => {
      const entries = Object.entries(TRACK_CONFIGS).filter(([, c]) => c.group === group)
      if (!entries.length) return

      const section = el('div', 'track-type-section')
      section.appendChild(el('div', 'track-type-section-label', label))
      const subGrid = el('div', 'track-type-subgrid')

      entries.forEach(([type, cfg]) => {
        const btn = el('button', 'track-type-btn')
        btn.innerHTML = `${cfg.icon} ${cfg.name}`
        btn.dataset.type = type
        btn.addEventListener('click', () => {
          grid.querySelectorAll('.track-type-btn').forEach(b => b.classList.remove('selected'))
          btn.classList.add('selected')
          _pendingTrackType = type
          const ni = $('add-track-name')
          if (ni && (!ni.value || ni.value === _lastDefaultName)) {
            ni.value = cfg.defaultName
            _lastDefaultName = cfg.defaultName
          }
        })
        subGrid.appendChild(btn)
      })
      section.appendChild(subGrid)
      grid.appendChild(section)
    })

    $('modal-add-track').classList.add('open')
    setTimeout(() => { const ni = $('add-track-name'); if (ni) ni.focus() }, 50)
  }

  function closeAddTrack() { $('modal-add-track').classList.remove('open') }

  function confirmAddTrack() {
    if (!_pendingTrackType) { toast('Choisissez un type de piste'); return }
    const cfg = TRACK_CONFIGS[_pendingTrackType]
    const nameVal = ($('add-track-name').value || '').trim()
    const track = {
      id: 't' + TID++,
      type: _pendingTrackType,
      name: nameVal || cfg.defaultName,
      collapsed: false,
    }
    S.tracks.push(track)
    closeAddTrack()
    render()
    toast(`Piste "${track.name}" ajoutée`)
  }

  function removeTrack(id) {
    S.tracks = S.tracks.filter(t => t.id !== id)
    S.blocks = S.blocks.filter(b => b.trackId !== id)
    if (S.selectedBlockId && !S.blocks.find(b => b.id === S.selectedBlockId)) {
      S.selectedBlockId = null
      closePanel()
    }
    render()
    toast('Track removed')
  }

  function normalizeTrackOrder() {
    const rank = t => {
      const cfg = TRACK_CONFIGS[t.type]
      if (!cfg) return 1
      if (t.type === 'staff') return 3
      if (cfg.group === 'free') return 0
      if (cfg.group === 'main') return 1
      if (cfg.group === 'sub')  return 2
      return 1
    }
    const indexed = S.tracks.map((t, i) => ({ t, i }))
    indexed.sort((a, b) => rank(a.t) - rank(b.t) || a.i - b.i)
    S.tracks = indexed.map(({ t }) => t)
  }

  function toggleTrackCollapse(id) {
    const track = S.tracks.find(t => t.id === id)
    if (!track) return
    track.collapsed = !track.collapsed
    render()
  }

  function toggleGroupCollapse() {
    S.groupCollapsed = !S.groupCollapsed
    render()
  }

  function moveTrack(id, dir) {
    const idx = S.tracks.findIndex(t => t.id === id)
    const newIdx = idx + dir
    if (newIdx < 0 || newIdx >= S.tracks.length) return
    const tmp = S.tracks[idx]; S.tracks[idx] = S.tracks[newIdx]; S.tracks[newIdx] = tmp
    normalizeTrackOrder()
    render()
  }

  /* ═══════════════════════════════════════════════════════════
     BLOCKS CRUD
  ═══════════════════════════════════════════════════════════ */
  function dropBlock(type, trackId, measure = 1) {
    const def = BLOCK_DEFS[type]
    if (!def) return
    const isStaff = type === 'staff-bloc'
    const isMemoText = type === 'memo-text'
    const defaultMeasures = isStaff ? 1 : isMemoText ? 4 : 4

    // Anti-overlap: find first position that fully fits
    const trackBlocks = S.blocks.filter(b => b.trackId === trackId)
    const overlaps = (start, len) =>
      trackBlocks.some(b => start < b.measure + b.measures && start + len > b.measure)
    let m = measure
    while (overlaps(m, defaultMeasures) && m + defaultMeasures - 1 <= MEASURES) m++
    if (m + defaultMeasures - 1 > MEASURES) m = measure  // last resort

    const block = {
      id: 'b' + BID++,
      type,
      trackId,
      measure: m,
      measures: defaultMeasures,
      name: def.label,
      notes: '', chords: '', lyrics: '',
      tempo: S.tempo, key: S.key, muted: false,
      fretDots: [], staffNotes: '',
    }
    S.blocks.push(block)
    S.selectedBlockId = block.id
    render()
    openBlockDetail(block.id)
  }

  function openBlockDetail(id) {
    const block = S.blocks.find(b => b.id === id)
    if (!block) return
    S.selectedBlockId = id

    // Re-render to show selection
    render()

    const def = BLOCK_DEFS[block.type] || { label: block.type, icon:'◼' }
    const panel = $('panel')
    const body = $('panel-body')
    const footer = $('panel-footer')

    body.innerHTML = `
      <div class="field-group">
        <div class="field-label">Name</div>
        <input class="field-input" id="pf-name" value="${esc(block.name)}" type="text">
      </div>
      <div class="field-row">
        <div class="field-group">
          <div class="field-label">Start (measure)</div>
          <input class="field-input" id="pf-measure" type="number" min="1" max="${MEASURES}" value="${block.measure}">
        </div>
        <div class="field-group">
          <div class="field-label">Duration (measures)</div>
          <input class="field-input" id="pf-measures" type="number" min="1" max="16" value="${block.measures}">
        </div>
      </div>
      <div class="field-row">
        <div class="field-group">
          <div class="field-label">Key</div>
          <select class="field-select" id="pf-key">
            ${NOTES.map(n=>`<option${n===block.key?' selected':''}>${n}</option>`).join('')}
          </select>
        </div>
        <div class="field-group">
          <div class="field-label">Tempo (BPM)</div>
          <input class="field-input" id="pf-tempo" type="number" min="40" max="300" value="${block.tempo}">
        </div>
      </div>
      <div class="field-group">
        <div class="field-label">Chords / Notes</div>
        <input class="field-input" id="pf-chords" type="text" placeholder="Am - F - C - G…" value="${esc(block.chords)}">
      </div>
      <div class="field-group">
        <div class="field-label">Lyrics / Notes</div>
        <textarea class="field-textarea" id="pf-lyrics" placeholder="Lyrics or notes…">${esc(block.lyrics)}</textarea>
      </div>
      <div class="field-group">
        <div class="field-label">Harmonic Degrees</div>
        <div class="degree-display" id="pf-degrees"></div>
      </div>
    `

    // Render degree pills in panel
    const deg = $('pf-degrees')
    const rootIdx = NOTES.indexOf(block.key || S.key)
    SCALE_DEGREES.forEach(d => {
      const noteIdx = (rootIdx + d.interval) % 12
      const pill = el('div', 'degree-pill')
      pill.style.background = d.bg
      pill.style.color = d.color
      pill.style.borderColor = d.color + '44'
      pill.style.cursor = 'pointer'
      pill.textContent = `${d.degree} ${NOTES[noteIdx]}`
      pill.title = `Add ${NOTES[noteIdx]} to chords`
      pill.addEventListener('click', () => {
        const cf = $('pf-chords')
        cf.value = cf.value ? cf.value + ' - ' + NOTES[noteIdx] : NOTES[noteIdx]
      })
      deg.appendChild(pill)
    })

    // Track-specific extras in detail panel
    const parentTrack = S.tracks.find(t => t.id === block.trackId)
    if (parentTrack && parentTrack.type === 'fretboard') {
      body.appendChild(buildFretboard(block))
    }
    if (parentTrack && parentTrack.type === 'staff') {
      showStaffPalette(block)
    }

    footer.innerHTML = ''
    const saveBtn = el('button', 'btn primary', '✔ Save')
    saveBtn.addEventListener('click', saveBlockDetail)
    const delBtn = el('button', 'btn danger', '✕ Delete')
    delBtn.addEventListener('click', deleteBlock)
    footer.appendChild(saveBtn)
    footer.appendChild(delBtn)

    updateContextPanels(block)
    panel.classList.add('open')
  }

  function saveBlockDetail() {
    const block = S.blocks.find(b => b.id === S.selectedBlockId)
    if (!block) return
    block.name    = $('pf-name').value.trim() || BLOCK_DEFS[block.type].label
    block.measure = Math.max(1, Math.min(MEASURES, +$('pf-measure').value))
    block.measures= Math.max(1, Math.min(16, +$('pf-measures').value))
    block.key     = $('pf-key').value
    block.tempo   = +$('pf-tempo').value
    block.chords  = $('pf-chords').value
    block.lyrics  = $('pf-lyrics').value
    render()
    toast('Block saved')
  }

  function deleteBlock() {
    S.blocks = S.blocks.filter(b => b.id !== S.selectedBlockId)
    S.selectedBlockId = null
    closePanel()
    render()
    toast('Block deleted')
  }

  function closePanel() {
    S.selectedBlockId = null
    $('panel').classList.remove('open')
    render()
    updateContextPanels(null)
  }

     VERSIONS
  ═══════════════════════════════════════════════════════════ */
  function snapshotVersion() {
    S.versions.push({ v: S.version, state: JSON.stringify(S), at: Date.now() })
    S.version++
    $('version-badge').textContent = 'v' + S.version
    toast(`Snapshot v${S.version - 1} saved`)
  }

  /* ═══════════════════════════════════════════════════════════
     DARK / LIGHT MODE
  ═══════════════════════════════════════════════════════════ */
  function toggleDark() {
    S.darkMode = !S.darkMode
    document.documentElement.classList.toggle('light', !S.darkMode)
    $('dark-toggle').textContent = S.darkMode ? '🌙' : '☀️'
    toast(S.darkMode ? 'Dark mode' : 'Light mode')
  }

  /* ═══════════════════════════════════════════════════════════
     EXPORT — BROWSER VERSIONS (overridden by wireElectron)
  ═══════════════════════════════════════════════════════════ */
  function saveProject() {
    const data = serializeState()
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })
    const a = document.createElement('a')
    a.href = URL.createObjectURL(blob)
    a.download = (S.projectName || 'project') + '.bmb'
    a.click()
    toast('Project saved')
  }

  function openProject() {
    const input = document.createElement('input')
    input.type = 'file'
    input.accept = '.bmb,.json'
    input.onchange = e => {
      const file = e.target.files[0]
      if (!file) return
      const reader = new FileReader()
      reader.onload = ev => {
        try {
          loadState(JSON.parse(ev.target.result))
          toast('Project loaded')
        } catch { toast('Error: invalid project file') }
      }
      reader.readAsText(file)
    }
    input.click()
  }

  function exportHTML() {
    const html = buildExportHTML()
    const blob = new Blob([html], { type: 'text/html' })
    const a = document.createElement('a')
    a.href = URL.createObjectURL(blob)
    a.download = (S.projectName || 'chart') + '.html'
    a.click()
    toast('HTML exported')
  }

  function exportPDF() { window.print() }

  function showMidiImport() {
    toast('MIDI import requires the Electron app', 3000)
  }

  /* ═══════════════════════════════════════════════════════════
     STATE SERIALIZATION
  ═══════════════════════════════════════════════════════════ */
  function serializeState() {
    return {
      schema: '1.0',
      app: 'BertinoMusicBlocs',
      savedAt: new Date().toISOString(),
      projectName: $('project-name').value,
      key: S.key,
      timeSign: S.timeSign,
      tempo: S.tempo,
      darkMode: S.darkMode,
      version: S.version,
      groupCollapsed: S.groupCollapsed,
      tracks: S.tracks,
      blocks: S.blocks,
    }
  }

  function loadState(data) {
    if (data.app && data.app !== 'BertinoMusicBlocs') {
      // still try to load for forward-compat
    }
    S.key      = data.key      || 'C'
    S.timeSign = data.timeSign || '4/4'
    S.tempo    = data.tempo    || 120
    S.darkMode = data.darkMode !== false
    S.version  = data.version  || 1
    S.tracks        = data.tracks        || []
    S.blocks = (data.blocks || []).map(b => ({
      ...b,
      staffNotes: sanitizeStaffNotes(b.staffNotes),
      fretDots: Array.isArray(b.fretDots) ? b.fretDots : [],
      measures: Math.max(1, b.measures || 1),
    }))
    S.groupCollapsed = data.groupCollapsed || false
    S.projectName = data.projectName || 'Untitled Project'

    // Sync counters
    TID = S.tracks.reduce((m,t) => Math.max(m, +(t.id.replace('t',''))||0), 0) + 1
    BID = S.blocks.reduce((m,b) => Math.max(m, +(b.id.replace('b',''))||0), 0) + 1

    $('project-name').value = S.projectName
    $('key-select').value   = S.key
    $('time-select').value  = S.timeSign
    $('tempo-input').value  = S.tempo
    $('version-badge').textContent = 'v' + S.version
    document.documentElement.classList.toggle('light', !S.darkMode)
    $('dark-toggle').textContent = S.darkMode ? '🌙' : '☀️'

    S.selectedBlockId = null
    closePanel()
    updateKeyInfo()
    render()
  }

  /* ═══════════════════════════════════════════════════════════
     STANDALONE HTML EXPORT
  ═══════════════════════════════════════════════════════════ */

  /* ═══════════════════════════════════════════════════════════
     KEYBOARD SHORTCUTS
  ═══════════════════════════════════════════════════════════ */
  function bindKeys() {
    document.addEventListener('click', e => {
      const popup = $('staff-popup')
      if (popup && popup.classList.contains('open') && !popup.contains(e.target)) {
        hideStaffPopup()
      }
    })
    document.addEventListener('keydown', e => {
      const mod = e.metaKey || e.ctrlKey
      if (mod && e.key === 's') { e.preventDefault(); saveProject() }
      if (mod && e.key === 'o') { e.preventDefault(); openProject() }
      if (mod && e.key === 'n') { e.preventDefault(); newProject() }
      if (e.key === 'Escape') {
        if (_selectedNotes.length) { _selectedNotes = []; render(); return }
        if ($('staff-popup').classList.contains('open'))          hideStaffPopup()
        else if ($('staff-palette-float').classList.contains('open')) hideStaffPalette()
        else if ($('railroad-overlay').classList.contains('open')) closeRailroad()
        else if ($('modal-add-track').classList.contains('open')) closeAddTrack()
        else closePanel()
      }
      if ((e.key === 'Delete' || e.key === 'Backspace') && S.selectedBlockId &&
          !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) {
        deleteBlock()
      }

      // ── Arrow keys: move selected staff note ──────────────────
      if (_selectedNotes.length && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
        if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return
        e.preventDefault()
        if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
          const dir = e.key === 'ArrowUp' ? 1 : -1
          const refreshed = new Set()
          _selectedNotes.forEach(sel => {
            const block = S.blocks.find(b => b.id === sel.blockId)
            if (!block) return
            const tokens = (block.staffNotes||'').trim().split(/\s+/).filter(Boolean)
            const [dur, noteStr] = (tokens[sel.tokenIdx]||'').split(':')
            if (noteStr && noteStr !== 'Rest') {
              tokens[sel.tokenIdx] = `${dur}:${shiftNotePitch(noteStr, dir)}`
              block.staffNotes = tokens.join(' ')
              refreshed.add(block.id)
            }
          })
          refreshed.forEach(bid => { const b=S.blocks.find(x=>x.id===bid); if(b) refreshStaffChip(b) })
        } else if (_selectedNotes.length === 1) {
          // Left/Right: swap position (single note only)
          const sel = _selectedNotes[0]
          const block = S.blocks.find(b => b.id === sel.blockId)
          if (!block) return
          const tokens = (block.staffNotes||'').trim().split(/\s+/).filter(Boolean)
          const { tokenIdx } = sel
          if (e.key === 'ArrowLeft' && tokenIdx > 0) {
            ;[tokens[tokenIdx-1],tokens[tokenIdx]]=[tokens[tokenIdx],tokens[tokenIdx-1]]
            block.staffNotes = tokens.join(' ')
            _selectedNotes = [{ ...sel, tokenIdx: tokenIdx-1 }]
            refreshStaffChip(block)
          } else if (e.key === 'ArrowRight' && tokenIdx < tokens.length-1) {
            ;[tokens[tokenIdx],tokens[tokenIdx+1]]=[tokens[tokenIdx+1],tokens[tokenIdx]]
            block.staffNotes = tokens.join(' ')
            _selectedNotes = [{ ...sel, tokenIdx: tokenIdx+1 }]
            refreshStaffChip(block)
          }
        }
      }
    })
  }

  function newProject() {
    if (S.tracks.length > 0 || S.blocks.length > 0) {
      if (!confirm('Start a new project? Unsaved changes will be lost.')) return
    }
    S = {
      tracks: [], blocks: [], selectedBlockId: null,
      key: 'C', timeSign: '4/4', tempo: 120, darkMode: S.darkMode,
      versions: [], version: 1, projectName: 'Untitled Project',
      groupCollapsed: false,
    }
    TID = 1; BID = 1
    $('project-name').value = 'Untitled Project'
    $('key-select').value = 'C'
    $('time-select').value = '4/4'
    $('tempo-input').value = 120
    $('version-badge').textContent = 'v1'
    ensureDefaultTracks()
    closePanel()
    updateKeyInfo()
    render()
    updateContextPanels(null)
    toast('New project')
  }

  /* ═══════════════════════════════════════════════════════════
     UTILITY
  ═══════════════════════════════════════════════════════════ */
  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  }

  /* ═══════════════════════════════════════════════════════════
     DEFAULT TRACKS
  ═══════════════════════════════════════════════════════════ */
  function ensureDefaultTracks() {
    // Build order: 1.Lyrics  2.Fretboard  3.Structure  …sub-tracks…  4.Live Memo
    // Only insert if not already present (forward-compat with saved files)

    if (!S.tracks.some(t => t.type === 'live-memo'))
      S.tracks.push({ id:'t'+TID++, type:'live-memo', name:'Live Memo' })

    if (!S.tracks.some(t => t.type === 'memos'))
      S.tracks.push({ id:'t'+TID++, type:'memos', name:'Mémos' })

    if (!S.tracks.some(t => t.type === 'structure'))
      S.tracks.unshift({ id:'t'+TID++, type:'structure', name:'Structure' })

    if (!S.tracks.some(t => t.type === 'fretboard')) {
      const sIdx = S.tracks.findIndex(t => t.type === 'structure')
      S.tracks.splice(Math.max(0, sIdx), 0, { id:'t'+TID++, type:'fretboard', name:'Fretboard' })
    }

    if (!S.tracks.some(t => t.type === 'lyrics'))
      S.tracks.unshift({ id:'t'+TID++, type:'lyrics', name:'Lyrics' })
  }

      else if (FRET_MARKERS.has(f)) cls += ' marker'
      grid.appendChild(el('div', cls, String(f)))
    }

    // String rows: e(s=6) → E(s=1), top to bottom (standard chord-diagram view)
    for (let si = 5; si >= 0; si--) {
      const s = si + 1
      grid.appendChild(el('div', 'fret-str-header', FRET_STRINGS[si].toUpperCase()))
      for (let f = 1; f <= FRET_COUNT; f++) {
        const cell = el('div', 'fret-cell')
        if (block.fretDots.some(d => d.f === f && d.s === s)) {
          cell.classList.add('has-dot')
          cell.appendChild(el('div', 'fret-dot'))
        }
        cell.addEventListener('click', () => {
          toggleFretDot(block, f, s, cell)

          const chipDiag = document.querySelector(`.block-chip[data-block-id="${block.id}"] .mini-chord-diag`)
          if (chipDiag) chipDiag.replaceWith(buildMiniChordDiagram(block))
        })
        grid.appendChild(cell)
      }
    }
    container.appendChild(grid)

    const hint = el('div', 'fret-scroll-hint')
    const dotCount = el('span', 'fret-dot-count', String(block.fretDots.length))
    hint.appendChild(dotCount)
    hint.appendChild(document.createTextNode(' dots · scroll ↕ 1–16'))
    container.appendChild(hint)
    sec.appendChild(container)
    return sec
  }

  // ── STAFF ─────────────────────────────────────────────────
  // Inline SVG for note symbols that don't render in all fonts
  const NOTE_SVG = {
    w: `<svg width="16" height="20" viewBox="0 0 16 20"><ellipse cx="8" cy="14" rx="6" ry="4" stroke="currentColor" stroke-width="1.6" fill="none" transform="rotate(-15,8,14)"/></svg>`,
    h: `<svg width="16" height="20" viewBox="0 0 16 20"><ellipse cx="7" cy="15" rx="5.5" ry="3.5" stroke="currentColor" stroke-width="1.6" fill="none" transform="rotate(-15,7,15)"/><line x1="12.5" y1="14" x2="12.5" y2="1" stroke="currentColor" stroke-width="1.6"/></svg>`,
    s: `<svg width="18" height="20" viewBox="0 0 18 20"><ellipse cx="7" cy="15" rx="5.5" ry="3.5" fill="currentColor" transform="rotate(-15,7,15)"/><line x1="12.5" y1="14" x2="12.5" y2="0" stroke="currentColor" stroke-width="1.6"/><path d="M12.5 0.5 Q18 4 12.5 8" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M12.5 5 Q18 8.5 12.5 13" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>`,
    rest: `<svg width="14" height="20" viewBox="0 0 14 20"><line x1="2" y1="5" x2="12" y2="5" stroke="currentColor" stroke-width="1.5"/><line x1="12" y1="5" x2="2" y2="13" stroke="currentColor" stroke-width="1.5"/><line x1="2" y1="13" x2="12" y2="13" stroke="currentColor" stroke-width="1.5"/><circle cx="9.5" cy="17" r="2.5" fill="currentColor"/></svg>`,
  }

  const DURATIONS = [
    { k:'w',  sym: NOTE_SVG.w,                              tip:'Ronde'           },
    { k:'h',  sym: NOTE_SVG.h,                              tip:'Blanche'         },
    { k:'q',  sym: '♩',                                     tip:'Noire'           },
    { k:'e',  sym: '♪',                                     tip:'Croche'          },
    { k:'s',  sym: NOTE_SVG.s,                              tip:'Double croche'   },
    { k:'qt', sym: '♩<sup style="font-size:7px">3</sup>',   tip:'Noire triolet'   },
    { k:'et', sym: '♪<sup style="font-size:7px">3</sup>',   tip:'Croche triolet'  },
  ]
  const DUR_SYMS = { w:'○', h:'◑', q:'♩', e:'♪', s:'♬', qt:'♩³', et:'♪³' }

  // Treble-clef SVG for staff chip header
  const TREBLE_CLEF_SVG = `<svg width="14" height="52" viewBox="0 0 14 52" fill="none"><path d="M7 50 C3 44 2 38 2 32 C2 26 4 22 7 20 C10 18 12 20 12 24 C12 30 8 33 5 35 C2.5 37 2 39 2 41 C2 45 4.5 47 7.5 47 C10.5 47 12.5 44.5 12.5 41 C12.5 34 11 27 10 20 C9 13 9 7 11 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="7.5" cy="25" r="1.6" fill="currentColor"/></svg>`

  // Treble-clef pitch → y-position map (in a 80px staff chip content area)
  // Lines at y=16,26,36,46,56; step = 5px
  const STAFF_PITCH_Y = {
    // Octave 6 (above)
    'C6':1,
    // Octave 5
    'B5':6,'A5':8,'G5':11,'F5':16,'E5':21,'D5':26,'C5':31,
    // Octave 4
    'B4':36,'A4':41,'G4':46,'F4':51,'E4':56,'D4':61,'C4':66,

    'B3':71,'A3':76,'G3':81,'F3':86,'E3':91,'D3':96,'C3':101,
    // Sharps octave 5
    'G#5':11,'F#5':16,'E#5':21,'D#5':26,'C#5':31,'B#4':36,'A#4':41,'G#4':46,'F#4':51,'E#4':56,'D#4':61,'C#4':66,
    // Flats octave 5
    'Bb5':6,'Ab5':8,'Gb5':16,'Fb5':21,'Eb5':26,'Db5':31,'Cb5':36,
    // Sharps/flats octave 4

    // Sharps/flats octave 3

    'Bb3':71,'Ab3':76,'Gb3':81,'Eb3':91,'Db3':96,
