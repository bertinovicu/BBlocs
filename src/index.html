    row.appendChild(blocksEl)
    return row
  }

  /* ═══════════════════════════════════════════════════════════
     BLOCK CHIP
  ═══════════════════════════════════════════════════════════ */

  function makeResizeHandle(block) {
    const h = el('div', 'bchip-resize')
    h.title = 'Étirer'
    h.addEventListener('mousedown', e => {
      e.stopPropagation()
      e.preventDefault()
      h.classList.add('resizing')
      _resizing = { blockId: block.id, startX: e.clientX, startMeasures: block.measures, handle: h }
    })
    return h
  }

  let _dragBlockId   = null   // id of block chip being dragged
  let _chipDragging  = false  // guard to suppress click after drag
  let _dragTrackId   = null   // id of track row being reordered
  let _resizing      = null   // { blockId, startX, startMeasures, handle }
  let _selectedNote  = null   // { blockId, tokenIdx } — Ctrl+click selection

  // ── Note selection helpers ───────────────────────────────────
  const _DIATONIC = ['C','D','E','F','G','A','B']

  function shiftNotePitch(note, dir) {
    // dir: +1 = up (higher pitch), -1 = down
    const m = note.match(/^([A-G])([#b]?)(\d+)$/)
    if (!m) return note
    let oct = parseInt(m[3])
    let idx = _DIATONIC.indexOf(m[1])
    idx += dir
    if (idx >= 7) { idx -= 7; oct++ }
    if (idx < 0)  { idx += 7; oct-- }
    oct = Math.max(2, Math.min(7, oct))
    return `${_DIATONIC[idx]}${oct}`  // strip accidental on step move (standard)
  }

  function findNoteAtPos(block, chipOffsetX, trackRelY) {
    // chipOffsetX: X relative to chip left edge; trackRelY: Y in track-blocks
    const beatsPerMeasure = parseInt((S.timeSign||'4/4').split('/')[0]) || 4
    const numMeasures = Math.max(1, Math.min(4, block.measures || 1))
    const keySig = keySigInfo(S.key || 'C')
    const HEAD_W = 18 + keySig.count * 6 + 12 + 4
    const chipW  = block.measures * MEASURE_WIDTH - 6
    const MEAS_W = (chipW - HEAD_W) / numMeasures
    const svgX   = chipOffsetX
    const svgY   = trackRelY - 18
    const { notes } = parseStaffTokens(block.staffNotes, beatsPerMeasure)
    let best = null, bestDist = 16   // 16px snap radius
    notes.forEach((n, idx) => {
      if (n.measureIdx >= numMeasures) return
      const cx = HEAD_W + n.measureIdx * MEAS_W + (n.beatInMeasure / beatsPerMeasure) * MEAS_W + 10
      const cy = STAFF_PITCH_Y[n.note] ?? 36
      const d  = Math.sqrt((svgX - cx) ** 2 + (svgY - cy) ** 2)
      if (d < bestDist) { bestDist = d; best = idx }
    })
    return best  // tokenIdx or null
  }

  function buildBlockChip(block, track) {
    if (track && track.type === 'lyrics')    return buildLyricsChip(block)
    if (track && track.type === 'fretboard') return buildFretboardChip(block)
    if (track && track.type === 'staff')     return buildStaffChip(block)
    const def = BLOCK_DEFS[block.type] || { label: block.type, icon:'◼', color:'#475569' }
    const chip = el('div', 'block-chip')
    chip.dataset.blockId = block.id
    chip.draggable = true
    if (block.id === S.selectedBlockId) chip.classList.add('selected')
    if (block.muted) chip.classList.add('muted')

    chip.style.left  = ((block.measure - 1) * MEASURE_WIDTH) + 'px'
    chip.style.width = (block.measures * MEASURE_WIDTH - 4) + 'px'
    chip.classList.add(`bloc-${block.type}`)

    // Top bar: mute (center) + delete (right)
    const muteLabel = block.muted ? '🔇 MUTED' : '🔇 Mute'
    chip.innerHTML = `
      <div class="bchip-top">
        <button class="bchip-mute" title="Mute / Unmute block">${muteLabel}</button>
        <button class="bchip-del"  title="Delete block">✕</button>
      </div>
      <div class="bchip-main">
        <span class="bchip-icon">${def.icon}</span>
        <span class="bchip-label">${esc(block.name || def.label)}</span>
        <span class="bchip-dur">${block.measures}m</span>
      </div>
    `

    // Mute button
    chip.querySelector('.bchip-mute').addEventListener('click', e => {
      e.stopPropagation()
      toggleMute(block.id)
    })

    // Quick delete button
    chip.querySelector('.bchip-del').addEventListener('click', e => {
      e.stopPropagation()
      quickDeleteBlock(block.id)
    })

    // Drag to move / switch track
    chip.addEventListener('dragstart', e => {
      _dragBlockId  = block.id
      _chipDragging = true
      e.dataTransfer.effectAllowed = 'move'
      e.dataTransfer.setData('application/block-id', block.id)
      // Prevent palette type from leaking through
      e.dataTransfer.setData('text/plain', '')
      chip.classList.add('dragging')
    })
    chip.addEventListener('dragend', () => {
      chip.classList.remove('dragging')
      _dragBlockId = null
      setTimeout(() => { _chipDragging = false }, 0)
    })

    // Click to open detail panel (not after drag)
    chip.addEventListener('click', () => {
      if (_chipDragging) return
      openBlockDetail(block.id)
    })

    chip.appendChild(makeResizeHandle(block))
    return chip
  }

  function buildLyricsChip(block) {
    const def = BLOCK_DEFS[block.type] || { label: block.type, icon:'🎤', color:'#4b5563' }
    const chip = el('div', 'block-chip lyrics-chip')
    chip.dataset.blockId = block.id
    chip.draggable = true
    if (block.id === S.selectedBlockId) chip.classList.add('selected')
    if (block.muted) chip.classList.add('muted')
    chip.style.left  = ((block.measure - 1) * MEASURE_WIDTH) + 'px'
    chip.style.width = (block.measures * MEASURE_WIDTH - 4) + 'px'
    chip.classList.add(`bloc-${block.type}`)

    const muteLabel = block.muted ? '🔇 MUTED' : '🔇 Mute'
    const lyricText = (block.lyrics || '').trim()
    const bodyHTML = lyricText
      ? `<div class="lyrics-chip-name">${esc(block.name || def.label)}</div><div class="lyrics-chip-text">${esc(lyricText)}</div>`
      : `<div class="lyrics-chip-name">${esc(block.name || def.label)}</div><div class="lyrics-chip-empty">Paroles…</div>`

    chip.innerHTML = `
      <div class="bchip-top">
        <button class="bchip-mute" title="Mute">${muteLabel}</button>
        <button class="bchip-del"  title="Delete">✕</button>
      </div>
      <div class="lyrics-chip-body">${bodyHTML}</div>
    `

    chip.querySelector('.bchip-mute').addEventListener('click', e => { e.stopPropagation(); toggleMute(block.id) })
    chip.querySelector('.bchip-del').addEventListener('click',  e => { e.stopPropagation(); quickDeleteBlock(block.id) })
    chip.addEventListener('dragstart', e => {
      _dragBlockId = block.id; _chipDragging = true
      e.dataTransfer.effectAllowed = 'move'
      e.dataTransfer.setData('application/block-id', block.id)
      e.dataTransfer.setData('text/plain', '')
      chip.classList.add('dragging')
    })
    chip.addEventListener('dragend', () => {
      chip.classList.remove('dragging'); _dragBlockId = null
      setTimeout(() => { _chipDragging = false }, 0)
    })
    chip.addEventListener('click', () => { if (_chipDragging) return; openBlockDetail(block.id) })
    chip.appendChild(makeResizeHandle(block))
    return chip
  }

  function buildFretboardChip(block) {
    const def = BLOCK_DEFS[block.type] || { label: block.type, icon:'◼', color:'#475569' }
    const chip = el('div', 'block-chip fret-chip')
    chip.dataset.blockId = block.id
    chip.draggable = true
    if (block.id === S.selectedBlockId) chip.classList.add('selected')
    if (block.muted) chip.classList.add('muted')
    chip.style.left  = ((block.measure - 1) * MEASURE_WIDTH) + 'px'
    chip.style.width = (block.measures * MEASURE_WIDTH - 4) + 'px'
    chip.classList.add(`bloc-${block.type}`)

    const muteLabel = block.muted ? '🔇 MUTED' : '🔇 Mute'
    chip.innerHTML = `
      <div class="bchip-top">
        <button class="bchip-mute" title="Mute / Unmute">${muteLabel}</button>
        <button class="bchip-del"  title="Delete">✕</button>
      </div>
      <div class="fret-chip-body">
        <div class="fret-chip-type-col">
          <span class="fret-chip-type-text">${esc(block.name || def.label)}</span>
        </div>
        <div class="fret-chip-center"></div>
        <div class="fret-chip-chord-col">
          <span class="fret-chip-chord-name">${esc(block.chords) || '—'}</span>
        </div>
      </div>
    `
    chip.querySelector('.fret-chip-center').appendChild(buildMiniChordDiagram(block, 15, 5))

    chip.querySelector('.bchip-mute').addEventListener('click', e => { e.stopPropagation(); toggleMute(block.id) })
    chip.querySelector('.bchip-del').addEventListener('click',  e => { e.stopPropagation(); quickDeleteBlock(block.id) })
    chip.addEventListener('dragstart', e => {
      _dragBlockId = block.id; _chipDragging = true
      e.dataTransfer.effectAllowed = 'move'
      e.dataTransfer.setData('application/block-id', block.id)
      e.dataTransfer.setData('text/plain', '')
      chip.classList.add('dragging')
    })
    chip.addEventListener('dragend', () => {
      chip.classList.remove('dragging')
      _dragBlockId = null
      setTimeout(() => { _chipDragging = false }, 0)
    })
    chip.addEventListener('click', () => { if (_chipDragging) return; openBlockDetail(block.id) })
    chip.appendChild(makeResizeHandle(block))
    return chip
  }

  // cellSize: px per cell (default 13 for compact, 15 for center display)
  // rows: fret rows to show
  function buildMiniChordDiagram(block, cellSize = 13, rows = 4) {
    const dots = block.fretDots || []
    const STRINGS = ['E','A','D','G','B','e']
    const activeFrets = dots.map(d => d.f)
    const startFret = activeFrets.length ? Math.max(1, Math.min(...activeFrets)) : 1

    const diag = el('div', 'mini-chord-diag')

    // String-name header
    const head = el('div', 'mini-chord-head')
    STRINGS.forEach(s => {
      const h = el('span', 'mini-chord-str-hdr', s)
      h.style.width = cellSize + 'px'
      head.appendChild(h)
    })
    diag.appendChild(head)

    // Fret rows
    for (let f = startFret; f < startFret + rows; f++) {
      const frow = el('div', 'mini-chord-frow')
      for (let s = 1; s <= 6; s++) {
        const cell = el('span', 'mini-chord-cell')
        cell.style.width  = cellSize + 'px'
        cell.style.height = (cellSize - 2) + 'px'
        if (dots.some(d => d.f === f && d.s === s)) {
          const dot = el('span', 'mini-chord-dot')
          const ds = Math.round(cellSize * 0.55)
          dot.style.width = ds + 'px'; dot.style.height = ds + 'px'
          cell.appendChild(dot)
        }
        frow.appendChild(cell)
      }
      if (f === startFret && startFret > 1) {
        const fn = el('span', 'mini-chord-fnum', String(startFret))
        frow.appendChild(fn)
      }
      diag.appendChild(frow)
    }
    return diag
  }

  /* ── STAFF CHIP ──────────────────────────────────────────── */
  function buildStaffChip(block) {
    const def = BLOCK_DEFS[block.type] || { label: block.type, icon:'◼', color:'#475569' }
    const chip = el('div', 'block-chip staff-chip')
    chip.dataset.blockId = block.id
    chip.draggable = true
    if (block.id === S.selectedBlockId) chip.classList.add('selected')
    if (block.muted) chip.classList.add('muted')
    chip.style.left  = ((block.measure - 1) * MEASURE_WIDTH) + 'px'
    chip.style.width = (block.measures * MEASURE_WIDTH - 4) + 'px'
    chip.classList.add(`bloc-${block.type}`)

    const muteLabel = block.muted ? '🔇 MUTED' : '🔇 Mute'
    chip.innerHTML = `
      <div class="bchip-top">
        <button class="bchip-mute" title="Mute">${muteLabel}</button>
        <button class="bchip-del" title="Delete">✕</button>
      </div>
    `
    const chipW = block.measures * MEASURE_WIDTH - 6
    chip.appendChild(buildStaffSVG(block, chipW, 74))

    chip.querySelector('.bchip-mute').addEventListener('click', e => { e.stopPropagation(); toggleMute(block.id) })
    chip.querySelector('.bchip-del').addEventListener('click',  e => { e.stopPropagation(); quickDeleteBlock(block.id) })
    chip.addEventListener('dragstart', e => {
      _dragBlockId = block.id; _chipDragging = true
      e.dataTransfer.effectAllowed = 'move'
      e.dataTransfer.setData('application/block-id', block.id)
      e.dataTransfer.setData('text/plain', '')
      chip.classList.add('dragging')
    })
    chip.addEventListener('dragend', () => {
      chip.classList.remove('dragging'); _dragBlockId = null
      setTimeout(() => { _chipDragging = false }, 0)
    })
    chip.addEventListener('click', e => {
      if (_chipDragging) return
      if (e.target.closest('.bchip-top')) openBlockDetail(block.id)
      // else: bubbles to track-blocks click handler → note entry
    })
    chip.appendChild(makeResizeHandle(block))
    return chip
  }

  function buildStaffSVG(block, w, h) {
    const LINE_Y = [14,24,34,44,54]
    const NS = 'http://www.w3.org/2000/svg'
    const svg = document.createElementNS(NS,'svg')
    svg.setAttribute('width',w); svg.setAttribute('height',h)
    svg.setAttribute('viewBox',`0 0 ${w} ${h}`)

    const mk = (tag,attrs,parent) => {
      const el = document.createElementNS(NS,tag)
      for(const [k,v] of Object.entries(attrs)) el.setAttribute(k,v)
      if(parent) parent.appendChild(el)
      return el
    }
    const line = (x1,y1,x2,y2,op=0.22,w=1) =>
      mk('line',{x1,y1,x2,y2,stroke:`rgba(255,255,255,${op})`,'stroke-width':w},svg)
    const text = (x,y,str,sz=11,op=0.7,anchor='middle') => {
      const t = mk('text',{x,y,'font-size':sz,fill:`rgba(255,255,255,${op})`,'text-anchor':anchor,'font-family':'serif'},svg)
      t.textContent = str; return t
    }

    // ── Layout ──────────────────────────────────────────────────
    const beatsPerMeasure = parseInt((S.timeSign||'4/4').split('/')[0]) || 4
    const numMeasures     = Math.max(1, Math.min(4, block.measures || 1))
    const keySig          = keySigInfo(S.key || 'C')

    const CLEF_W    = 18
    const KEYSIG_W  = keySig.count * 6
    const TIMESIG_W = 12
    const HEAD_W    = CLEF_W + KEYSIG_W + TIMESIG_W + 4
    const NOTE_AREA = w - HEAD_W
    const MEAS_W    = NOTE_AREA / numMeasures

    // ── Staff lines ──────────────────────────────────────────────
    LINE_Y.forEach(y => line(0,y,w,y))

    // ── Treble clef ──────────────────────────────────────────────
    const clef = mk('text',{x:1,y:62,'font-size':54,fill:'rgba(255,255,255,0.55)','font-family':'serif'},svg)
    clef.textContent = '𝄞'

    // ── Key signature ─────────────────────────────────────────────
    if (keySig.count > 0) {
      const sym = keySig.type === '#' ? '♯' : '♭'
      keySig.yPos.forEach((y, i) => {
        const t = mk('text',{x: CLEF_W + i*6 + 3, y: y+4, 'font-size':9,
          fill:'rgba(255,255,255,0.75)', 'text-anchor':'middle','font-family':'serif'}, svg)
        t.textContent = sym
      })
    }

    // ── Time signature ────────────────────────────────────────────
    const [tsTop, tsBot] = (S.timeSign||'4/4').split('/')
    const tsX = CLEF_W + KEYSIG_W + 8
    const tTop = mk('text',{x:tsX,y:LINE_Y[1]+3,'font-size':12,fill:'rgba(255,255,255,0.65)',
      'text-anchor':'middle','font-weight':'bold','font-family':'sans-serif'},svg)
    tTop.textContent = tsTop || '4'
    const tBot = mk('text',{x:tsX,y:LINE_Y[3]+4,'font-size':12,fill:'rgba(255,255,255,0.65)',
      'text-anchor':'middle','font-weight':'bold','font-family':'sans-serif'},svg)
    tBot.textContent = tsBot || '4'

    // ── Barlines ──────────────────────────────────────────────────
    for (let i = 1; i < numMeasures; i++) {
      const bx = HEAD_W + i * MEAS_W
      line(bx, LINE_Y[0], bx, LINE_Y[4], 0.55, 1.5)
    }
    // Final double barline
    line(w-3, LINE_Y[0], w-3, LINE_Y[4], 0.55, 1.5)
    line(w-1, LINE_Y[0], w-1, LINE_Y[4], 0.55, 3)

    // ── Parse tokens ──────────────────────────────────────────────
    const { notes, totalBeats } = parseStaffTokens(block.staffNotes, beatsPerMeasure)
    const capacity = numMeasures * beatsPerMeasure

    // ── Overflow indicator ────────────────────────────────────────
    if (totalBeats > capacity + 0.01) {
      const warn = mk('text',{x:w-4,y:10,'font-size':9,fill:'rgba(255,180,50,0.9)',
        'text-anchor':'end','font-family':'sans-serif'},svg)
      warn.textContent = '!'
    }

    // ── Render notes ──────────────────────────────────────────────
    // Collect beam groups (consecutive e/s in same measure)
    const beamGroups = []
    let curGroup = null

    notes.forEach((n, idx) => {
      if (n.measureIdx >= numMeasures) return   // outside chip

      const cx = HEAD_W + n.measureIdx * MEAS_W
              + (n.beatInMeasure / beatsPerMeasure) * MEAS_W + 10
      const cy = STAFF_PITCH_Y[n.note] ?? (n.note==='Rest' ? 34 : 36)
      const isRest  = n.note === 'Rest' || n.note === 'r'
      const isSel   = _selectedNote && _selectedNote.blockId === block.id && _selectedNote.tokenIdx === idx
      const isTriplet = n.dur === 'qt' || n.dur === 'et'
      const baseDur   = isTriplet ? n.dur.slice(0,-1) : n.dur  // 'q' or 'e'
      const filled  = baseDur !== 'w' && baseDur !== 'h'
      const hasStem = baseDur !== 'w'
      const stemUp  = cy >= 34
      const stemX   = stemUp ? cx+5 : cx-5
      const stemEndY = stemUp ? cy-18 : cy+18
      const hasFlag = baseDur === 'e' || baseDur === 's' || n.dur === 'et'
      const beamable = (hasFlag || isTriplet) && !isRest

      // ── Ledger lines ──
      if (!isRest) {
        if (cy >= 59) {
          const bot = LINE_Y[LINE_Y.length-1]
          for (let ly = bot+10; ly <= cy+3; ly+=10) line(cx-7,ly,cx+7,ly,0.55)
        }
        if (cy <= 9) {
          const top = LINE_Y[0]
          for (let ly = top-10; ly >= cy-3; ly-=10) line(cx-7,ly,cx+7,ly,0.55)
        }
      }

      if (isRest) {
        // ── Rests ──
        if (n.dur === 'w') {
          // Whole rest: filled rect under line 2
          mk('rect',{x:cx-6,y:LINE_Y[1],width:12,height:5,
            fill:'rgba(255,255,255,0.8)'},svg)
        } else if (n.dur === 'h') {
          // Half rest: hollow rect on line 3
          mk('rect',{x:cx-6,y:LINE_Y[2]-5,width:12,height:5,
            fill:'none',stroke:'rgba(255,255,255,0.8)','stroke-width':1.2},svg)
        } else {
          // Quarter/8th/16th rest: Z-shape
          const zx=cx-4,zy=LINE_Y[1]+2
          const rp = mk('path',{d:`M${zx},${zy} L${zx+8},${zy} L${zx},${zy+8} L${zx+8},${zy+8}`,
            stroke:'rgba(255,255,255,0.8)','stroke-width':1.5,fill:'none','stroke-linecap':'round'},svg)
          if (n.dur==='e'||n.dur==='s') {
            const fp = mk('path',{d:`M${cx+4},${zy-2} Q${cx+10},${zy+2} ${cx+4},${zy+7}`,
              stroke:'rgba(255,255,255,0.8)','stroke-width':1.5,fill:'none'},svg)
          }
        }
      } else {
        // ── Accidental ──
        const accMatch = n.note.match(/[#b]/)
        if (accMatch) {
          const accSym = accMatch[0]==='#' ? '♯' : '♭'
          const at = mk('text',{x:cx-9,y:cy+4,'font-size':9,fill:'rgba(255,255,255,0.8)',
            'text-anchor':'middle','font-family':'serif'},svg)
          at.textContent = accSym
        }

        // ── Notehead ──
        const noteColor = isSel ? '#4ade80' : 'rgba(255,255,255,0.88)'
        const ell = mk('ellipse',{cx,cy,rx:5,ry:3.5,transform:`rotate(-15,${cx},${cy})`},svg)
        if (filled) {
          ell.setAttribute('fill', noteColor)
        } else {
          ell.setAttribute('fill','none')
          ell.setAttribute('stroke', noteColor)
          ell.setAttribute('stroke-width','1.5')
        }
        // Selection ring
        if (isSel) {
          mk('ellipse',{cx,cy,rx:8,ry:6.5,transform:`rotate(-15,${cx},${cy})`,
            fill:'none',stroke:'#4ade80','stroke-width':'1.5','stroke-dasharray':'3 2'},svg)
        }

        // ── Dot ──
        if (n.dotted) mk('circle',{cx:cx+8,cy:cy-1,r:1.5,fill:'rgba(255,255,255,0.8)'},svg)

        // ── Stem ──
        if (hasStem) line(stemX,cy,stemX,stemEndY,0.88)

        // ── Flag helper (filled leaf shape) ──
        const drawFlag = (fy0, offset) => {
          const d = stemUp
            ? `M${stemX},${fy0+offset} C${stemX+11},${fy0+offset+1} ${stemX+10},${fy0+offset+8} ${stemX+1},${fy0+offset+11} C${stemX+5},${fy0+offset+6} ${stemX+2},${fy0+offset+2} ${stemX},${fy0+offset} Z`
            : `M${stemX},${fy0-offset} C${stemX-11},${fy0-offset-1} ${stemX-10},${fy0-offset-8} ${stemX-1},${fy0-offset-11} C${stemX-5},${fy0-offset-6} ${stemX-2},${fy0-offset-2} ${stemX},${fy0-offset} Z`
          mk('path',{d,fill:'rgba(255,255,255,0.88)',stroke:'none'},svg)
        }
        // ── Flags (8th = 1 flag, 16th = 2 flags, et = 1 flag) ──
        if (n.dur==='e'||n.dur==='s'||n.dur==='et') {
          drawFlag(stemEndY, 0)
          if (n.dur==='s') drawFlag(stemEndY, stemUp ? 7 : -7)
        }

        // ── Beam grouping data (collect for post-pass) ──
        if (beamable) {
          if (!curGroup || curGroup.measureIdx !== n.measureIdx ||
              curGroup.isTriplet !== isTriplet ||
              Math.floor(n.beatInMeasure) !== Math.floor(curGroup.lastBeat)) {
            curGroup = { measureIdx:n.measureIdx, lastBeat:n.beatInMeasure,
                         isTriplet, items:[{cx, stemX, stemEndY, stemUp}] }
            beamGroups.push(curGroup)
          } else {
            curGroup.items.push({cx, stemX, stemEndY, stemUp})
            curGroup.lastBeat = n.beatInMeasure
          }
        } else {
          curGroup = null
        }
      }
    })

    // ── Beams + triplet brackets (draw after all noteheads) ──
    beamGroups.forEach(grp => {
      if (grp.items.length < 2) return
      const x1 = grp.items[0].stemX
      const x2 = grp.items[grp.items.length-1].stemX
      const y1 = grp.items[0].stemEndY
      const y2 = grp.items[grp.items.length-1].stemEndY
      // Beam bar
      mk('line',{x1,y1,x2,y2,stroke:'rgba(255,255,255,0.88)','stroke-width':3,'stroke-linecap':'round'},svg)
      // Triplet bracket + "3"
      if (grp.isTriplet && grp.items.length === 3) {
        const up   = grp.items[0].stemUp
        const bY   = up ? Math.min(y1,y2) - 5 : Math.max(y1,y2) + 5
        const midX = (x1 + x2) / 2
        const sign = up ? -1 : 1
        mk('line',{x1:x1-1,y1:bY,x2:x1-1,y2:bY+sign*5,stroke:'rgba(255,255,255,0.65)','stroke-width':1},svg)
        mk('line',{x1:x1-1,y1:bY,x2:x2+1,y2:bY,stroke:'rgba(255,255,255,0.65)','stroke-width':1},svg)
        mk('line',{x1:x2+1,y1:bY,x2:x2+1,y2:bY+sign*5,stroke:'rgba(255,255,255,0.65)','stroke-width':1},svg)
        const t3 = mk('text',{x:midX,y:bY-sign*1,'font-size':8,fill:'rgba(255,255,255,0.85)',
          'text-anchor':'middle','font-family':'serif'},svg)
        t3.textContent = '3'
      }
    })

    return svg
  }

  // Map track-blocks Y → nearest [letter, octave] using SVG coordinate system
  // bchip-top = 18px, so SVG Y = relY - 18; STAFF_PITCH_Y step = 5px
  const _STAFF_PITCH_TABLE = [
    {l:'G',o:5,y:11},{l:'F',o:5,y:16},{l:'E',o:5,y:21},{l:'D',o:5,y:26},{l:'C',o:5,y:31},
    {l:'B',o:4,y:36},{l:'A',o:4,y:41},{l:'G',o:4,y:46},{l:'F',o:4,y:51},{l:'E',o:4,y:56},
    {l:'D',o:4,y:61},{l:'C',o:4,y:66},{l:'B',o:3,y:71},{l:'A',o:3,y:76},{l:'G',o:3,y:81},
  ]
  function staffYToPitch(relY) {
    const svgY = relY - 18  // subtract bchip-top height
    let best = _STAFF_PITCH_TABLE[0], bestD = Math.abs(svgY - best.y)
    for (const p of _STAFF_PITCH_TABLE) {
      const d = Math.abs(svgY - p.y)
      if (d < bestD) { bestD = d; best = p }
    }
    return [best.l, best.o]
  }
  function staffPitchToTrackY(letter, octave) {
    const key = `${letter}${octave}`
    return 18 + (STAFF_PITCH_Y[key] ?? 36)
  }

  /* ── STAFF NOTE POPUP ────────────────────────────────────── */
  let _spBlock  = null
  let _spDur    = 'q'
  let _spAcc    = ''
  let _spOctave = 4

  function showStaffPopup(block, x, y, pitchHint) {
    _spBlock  = block
    _spDur    = 'q'
    _spAcc    = ''
    _spOctave = (pitchHint && pitchHint[1]) ? pitchHint[1] : 4
    const popup = $('staff-popup')

    popup.innerHTML = `
      <div class="sp-title">Saisie note — clic droit portée</div>
      <div id="sp-dur-row"  class="ctx-staff-row"></div>
      <div id="sp-acc-row"  class="ctx-staff-row"></div>
      <div id="sp-note-row" class="ctx-staff-row"></div>
      <div class="ctx-staff-row" style="justify-content:space-between">
        <button class="ctx-staff-btn" id="sp-rest-btn" title="Silence"></button>
        <button class="ctx-staff-btn" id="sp-bk-btn" title="Supprimer dernière note">⌫</button>
        <button class="btn danger" onclick="hideStaffPopup()" style="padding:2px 8px;font-size:11px">✕</button>
      </div>
    `
    // Inject rest SVG
    $('sp-rest-btn').innerHTML = NOTE_SVG.rest

    // Duration buttons
    const durRow = $('sp-dur-row')
    const durBtns = {}
    DURATIONS.forEach(({ k, sym, tip }) => {
      const btn = el('button', 'ctx-staff-btn' + (k === _spDur ? ' sel' : ''), sym)
      btn.title = tip
      btn.addEventListener('click', () => {
        _spDur = k
        Object.values(durBtns).forEach(b => b.classList.remove('sel'))
        btn.classList.add('sel')
      })
      durBtns[k] = btn
      durRow.appendChild(btn)
    })

    // Accidental buttons
    const accRow = $('sp-acc-row')
    const accBtns = {}
    const ACC = [{ k:'#', sym:'♯' },{ k:'b', sym:'♭' },{ k:'', sym:'♮' }]
    ACC.forEach(({ k, sym }) => {
      const btn = el('button', 'ctx-staff-btn' + (k === _spAcc ? ' acc-sel' : ''), sym)
      btn.addEventListener('click', () => {
        _spAcc = k
        Object.values(accBtns).forEach(b => b.classList.remove('acc-sel'))
        btn.classList.add('acc-sel')
      })
      accBtns[k] = btn
      accRow.appendChild(btn)
    })

    // Octave selector row
    const spOctRow = el('div', 'ctx-staff-row')
    spOctRow.id = 'sp-oct-row'
    $('sp-note-row').before(spOctRow)
    const spOctBtns = {}
    ;[3,4,5,6].forEach(oct => {
      const btn = el('button', 'ctx-staff-btn' + (oct === _spOctave ? ' sel' : ''), String(oct))
      btn.title = `Octave ${oct}`
      btn.addEventListener('click', () => {
        _spOctave = oct
        Object.values(spOctBtns).forEach(b => b.classList.remove('sel'))
        btn.classList.add('sel')
      })
      spOctBtns[oct] = btn; spOctRow.appendChild(btn)
    })
    const spOctLbl = el('span', '', 'oct')
    spOctLbl.style.cssText = 'font-size:9px;opacity:0.5;margin-left:3px;align-self:center'
    spOctRow.appendChild(spOctLbl)

    // Note buttons  (pitch hint pre-selects the note letter)
    const noteRow = $('sp-note-row')
    const hintLetter = pitchHint ? pitchHint[0] : null
    ;['C','D','E','F','G','A','B'].forEach(n => {
      const btn = el('button', 'ctx-staff-btn', n)
      if (hintLetter === n) btn.classList.add('sel')
      btn.addEventListener('click', () => {
        staffAppendToBlock(_spBlock, n)
        noteRow.querySelectorAll('.ctx-staff-btn').forEach(b => b.classList.remove('sel'))
        btn.classList.add('sel')
      })
      noteRow.appendChild(btn)
    })

    // Backspace
    $('sp-bk-btn').addEventListener('click', () => {
      const tokens = (_spBlock.staffNotes || '').trim().split(/\s+/).filter(Boolean)
      tokens.pop()
      _spBlock.staffNotes = tokens.join(' ')
      refreshStaffChip(_spBlock)
    })

    // Rest
    $('sp-rest-btn').addEventListener('click', () => {
      staffAppendToBlock(_spBlock, 'Rest')
    })

    // Position popup near click but keep on screen
    const pw = 230, ph = 160
    popup.style.left = Math.min(x, window.innerWidth  - pw - 8) + 'px'
    popup.style.top  = Math.min(y, window.innerHeight - ph - 8) + 'px'
    popup.classList.add('open')
  }

  function hideStaffPopup() {
    $('staff-popup').classList.remove('open')
    _spBlock = null
  }

  function staffAppendToBlock(block, noteName) {
    if (!block) return
    const token = noteName === 'Rest'
      ? `${_spDur}:Rest`
      : `${_spDur}:${noteName}${_spAcc}${_spOctave}`
    _spAcc = ''
    block.staffNotes = block.staffNotes ? block.staffNotes + ' ' + token : token
    refreshStaffChip(block)
    // Reset acc buttons
    const popup = $('staff-popup')
    if (popup) popup.querySelectorAll('.ctx-staff-btn.acc-sel').forEach(b => b.classList.remove('acc-sel'))
  }

  function refreshStaffChip(block) {
    const chip = document.querySelector(`.block-chip[data-block-id="${block.id}"]`)
    if (!chip) { render(); return }
    const oldSvg = chip.querySelector('svg')
    const chipW = block.measures * MEASURE_WIDTH - 6
    const newSvg = buildStaffSVG(block, chipW, 74)
    if (oldSvg) chip.replaceChild(newSvg, oldSvg)
    else chip.appendChild(newSvg)
    // Sync left panel display if open
    const display = document.querySelector('.ctx-staff-display')
    if (display) display.textContent = staffFormat(block.staffNotes)
  }

  function toggleMute(id) {
    const block = S.blocks.find(b => b.id === id)
    if (!block) return
    block.muted = !block.muted
    render()
    toast(block.muted ? '🔇 Muted' : '🔊 Unmuted')
  }

  function quickDeleteBlock(id) {
    S.blocks = S.blocks.filter(b => b.id !== id)
    if (S.selectedBlockId === id) { S.selectedBlockId = null; closePanel() }
    render()
    toast('Block deleted')
  }

  /* ═══════════════════════════════════════════════════════════
     TRACKS CRUD
  ═══════════════════════════════════════════════════════════ */
  let _pendingTrackType = null
  let _lastDefaultName  = ''

  function showAddTrack() {
    _pendingTrackType = null
    _lastDefaultName  = ''
    const grid = $('track-type-grid')
    grid.innerHTML = ''
    const nameInput = $('add-track-name')
    if (nameInput) nameInput.value = ''

    const SECTIONS = [
      { group:'main', label:'Piste principale' },
      { group:'sub',  label:'Sous-pistes  (sous Structure)' },
      { group:'free', label:'Pistes libres' },
    ]

    SECTIONS.forEach(({ group, label }) => {
      const entries = Object.entries(TRACK_CONFIGS).filter(([, c]) => c.group === group)
      if (!entries.length) return

      const section = el('div', 'track-type-section')
      section.appendChild(el('div', 'track-type-section-label', label))
      const subGrid = el('div', 'track-type-subgrid')

      entries.forEach(([type, cfg]) => {
        const btn = el('button', 'track-type-btn')
        btn.innerHTML = `${cfg.icon} ${cfg.name}`
        btn.dataset.type = type
        btn.addEventListener('click', () => {
          grid.querySelectorAll('.track-type-btn').forEach(b => b.classList.remove('selected'))
          btn.classList.add('selected')
          _pendingTrackType = type
          const ni = $('add-track-name')
          if (ni && (!ni.value || ni.value === _lastDefaultName)) {
            ni.value = cfg.defaultName
            _lastDefaultName = cfg.defaultName
          }
        })
        subGrid.appendChild(btn)
      })
      section.appendChild(subGrid)
      grid.appendChild(section)
    })

    $('modal-add-track').classList.add('open')
    setTimeout(() => { const ni = $('add-track-name'); if (ni) ni.focus() }, 50)
  }

  function closeAddTrack() { $('modal-add-track').classList.remove('open') }

  function confirmAddTrack() {
    if (!_pendingTrackType) { toast('Choisissez un type de piste'); return }
    const cfg = TRACK_CONFIGS[_pendingTrackType]
    const nameVal = ($('add-track-name').value || '').trim()
    const track = {
      id: 't' + TID++,
      type: _pendingTrackType,
      name: nameVal || cfg.defaultName,
      collapsed: false,
    }
    S.tracks.push(track)
    closeAddTrack()
    render()
    toast(`Piste "${track.name}" ajoutée`)
  }

  function removeTrack(id) {
    S.tracks = S.tracks.filter(t => t.id !== id)
    S.blocks = S.blocks.filter(b => b.trackId !== id)
    if (S.selectedBlockId && !S.blocks.find(b => b.id === S.selectedBlockId)) {
      S.selectedBlockId = null
      closePanel()
    }
    render()
    toast('Track removed')
  }

  function normalizeTrackOrder() {
    const rank = t => {
      const cfg = TRACK_CONFIGS[t.type]
      if (!cfg) return 1
      if (t.type === 'staff') return 3
      if (cfg.group === 'free') return 0
      if (cfg.group === 'main') return 1
      if (cfg.group === 'sub')  return 2
      return 1
    }
    const indexed = S.tracks.map((t, i) => ({ t, i }))
    indexed.sort((a, b) => rank(a.t) - rank(b.t) || a.i - b.i)
    S.tracks = indexed.map(({ t }) => t)
  }

  function toggleTrackCollapse(id) {
    const track = S.tracks.find(t => t.id === id)
    if (!track) return
    track.collapsed = !track.collapsed
    render()
  }

  function toggleGroupCollapse() {
    S.groupCollapsed = !S.groupCollapsed
    render()
  }

  function moveTrack(id, dir) {
    const idx = S.tracks.findIndex(t => t.id === id)
    const newIdx = idx + dir
    if (newIdx < 0 || newIdx >= S.tracks.length) return
    const tmp = S.tracks[idx]; S.tracks[idx] = S.tracks[newIdx]; S.tracks[newIdx] = tmp
    normalizeTrackOrder()
    render()
  }

  /* ═══════════════════════════════════════════════════════════
     BLOCKS CRUD
  ═══════════════════════════════════════════════════════════ */
  function dropBlock(type, trackId, measure = 1) {
    const def = BLOCK_DEFS[type]
    if (!def) return
    const isStaff = type === 'staff-bloc'
    const defaultMeasures = isStaff ? 1 : 4

    // Anti-overlap: find first position that fully fits
    const trackBlocks = S.blocks.filter(b => b.trackId === trackId)
    const overlaps = (start, len) =>
      trackBlocks.some(b => start < b.measure + b.measures && start + len > b.measure)
    let m = measure
    while (overlaps(m, defaultMeasures) && m + defaultMeasures - 1 <= MEASURES) m++
    if (m + defaultMeasures - 1 > MEASURES) m = measure  // last resort

    const block = {
      id: 'b' + BID++,
      type,
      trackId,
      measure: m,
      measures: defaultMeasures,
      name: def.label,
      notes: '', chords: '', lyrics: '',
      tempo: S.tempo, key: S.key, muted: false,
      fretDots: [], staffNotes: '',
    }
    S.blocks.push(block)
    S.selectedBlockId = block.id
    render()
    openBlockDetail(block.id)
  }

  function openBlockDetail(id) {
    const block = S.blocks.find(b => b.id === id)
    if (!block) return
    S.selectedBlockId = id

    // Re-render to show selection
    render()

    const def = BLOCK_DEFS[block.type] || { label: block.type, icon:'◼' }
    const panel = $('panel')
    const body = $('panel-body')
    const footer = $('panel-footer')

    body.innerHTML = `
      <div class="field-group">
        <div class="field-label">Name</div>
        <input class="field-input" id="pf-name" value="${esc(block.name)}" type="text">
      </div>
      <div class="field-row">
        <div class="field-group">
          <div class="field-label">Start (measure)</div>
          <input class="field-input" id="pf-measure" type="number" min="1" max="${MEASURES}" value="${block.measure}">
        </div>
        <div class="field-group">
          <div class="field-label">Duration (measures)</div>
          <input class="field-input" id="pf-measures" type="number" min="1" max="16" value="${block.measures}">
        </div>
      </div>
      <div class="field-row">
        <div class="field-group">
          <div class="field-label">Key</div>
          <select class="field-select" id="pf-key">
            ${NOTES.map(n=>`<option${n===block.key?' selected':''}>${n}</option>`).join('')}
          </select>
        </div>
        <div class="field-group">
          <div class="field-label">Tempo (BPM)</div>
          <input class="field-input" id="pf-tempo" type="number" min="40" max="300" value="${block.tempo}">
        </div>
      </div>
      <div class="field-group">
        <div class="field-label">Chords / Notes</div>
        <input class="field-input" id="pf-chords" type="text" placeholder="Am - F - C - G…" value="${esc(block.chords)}">
      </div>
      <div class="field-group">
        <div class="field-label">Lyrics / Notes</div>
        <textarea class="field-textarea" id="pf-lyrics" placeholder="Lyrics or notes…">${esc(block.lyrics)}</textarea>
      </div>
      <div class="field-group">
        <div class="field-label">Harmonic Degrees</div>
        <div class="degree-display" id="pf-degrees"></div>
      </div>
    `

    // Render degree pills in panel
    const deg = $('pf-degrees')
    const rootIdx = NOTES.indexOf(block.key || S.key)
    SCALE_DEGREES.forEach(d => {
      const noteIdx = (rootIdx + d.interval) % 12
      const pill = el('div', 'degree-pill')
      pill.style.background = d.bg
      pill.style.color = d.color
      pill.style.borderColor = d.color + '44'
      pill.style.cursor = 'pointer'
      pill.textContent = `${d.degree} ${NOTES[noteIdx]}`
      pill.title = `Add ${NOTES[noteIdx]} to chords`
      pill.addEventListener('click', () => {
        const cf = $('pf-chords')
        cf.value = cf.value ? cf.value + ' - ' + NOTES[noteIdx] : NOTES[noteIdx]
      })
      deg.appendChild(pill)
    })

    // Track-specific extras in detail panel
    const parentTrack = S.tracks.find(t => t.id === block.trackId)
    if (parentTrack && parentTrack.type === 'fretboard') {
      body.appendChild(buildFretboard(block))
    }
    if (parentTrack && parentTrack.type === 'staff') {
      showStaffPalette(block)
    }

    footer.innerHTML = ''
    const saveBtn = el('button', 'btn primary', '✔ Save')
    saveBtn.addEventListener('click', saveBlockDetail)
    const delBtn = el('button', 'btn danger', '✕ Delete')
    delBtn.addEventListener('click', deleteBlock)
    footer.appendChild(saveBtn)
    footer.appendChild(delBtn)

    updateContextPanels(block)
    panel.classList.add('open')
  }

  function saveBlockDetail() {
    const block = S.blocks.find(b => b.id === S.selectedBlockId)
    if (!block) return
    block.name    = $('pf-name').value.trim() || BLOCK_DEFS[block.type].label
    block.measure = Math.max(1, Math.min(MEASURES, +$('pf-measure').value))
    block.measures= Math.max(1, Math.min(16, +$('pf-measures').value))
    block.key     = $('pf-key').value
    block.tempo   = +$('pf-tempo').value
    block.chords  = $('pf-chords').value
    block.lyrics  = $('pf-lyrics').value
    render()
    toast('Block saved')
  }

  function deleteBlock() {
    S.blocks = S.blocks.filter(b => b.id !== S.selectedBlockId)
    S.selectedBlockId = null
    closePanel()
    render()
    toast('Block deleted')
  }

  function closePanel() {
    S.selectedBlockId = null
    $('panel').classList.remove('open')
    render()
    updateContextPanels(null)
  }

     VERSIONS
  ═══════════════════════════════════════════════════════════ */
  function snapshotVersion() {
    S.versions.push({ v: S.version, state: JSON.stringify(S), at: Date.now() })
    S.version++
    $('version-badge').textContent = 'v' + S.version
    toast(`Snapshot v${S.version - 1} saved`)
  }

     DARK / LIGHT MODE
  ═══════════════════════════════════════════════════════════ */
  function toggleDark() {
    S.darkMode = !S.darkMode
    document.documentElement.classList.toggle('light', !S.darkMode)
    $('dark-toggle').textContent = S.darkMode ? '🌙' : '☀️'
    toast(S.darkMode ? 'Dark mode' : 'Light mode')
  }

  /* ═══════════════════════════════════════════════════════════
     EXPORT — BROWSER VERSIONS (overridden by wireElectron)
  ═══════════════════════════════════════════════════════════ */
  function saveProject() {
    const data = serializeState()
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })
    const a = document.createElement('a')
    a.href = URL.createObjectURL(blob)
    a.download = (S.projectName || 'project') + '.bmb'
    a.click()
    toast('Project saved')
  }

  function openProject() {
    const input = document.createElement('input')
    input.type = 'file'
    input.accept = '.bmb,.json'
    input.onchange = e => {
      const file = e.target.files[0]
      if (!file) return
      const reader = new FileReader()
      reader.onload = ev => {
        try {
          loadState(JSON.parse(ev.target.result))
          toast('Project loaded')
        } catch { toast('Error: invalid project file') }
      }
      reader.readAsText(file)
    }
    input.click()
  }

  function exportHTML() {
    const html = buildExportHTML()
    const blob = new Blob([html], { type: 'text/html' })
    const a = document.createElement('a')
    a.href = URL.createObjectURL(blob)
    a.download = (S.projectName || 'chart') + '.html'
    a.click()
    toast('HTML exported')
  }

  function exportPDF() { window.print() }

  function showMidiImport() {
    toast('MIDI import requires the Electron app', 3000)
  }

  /* ═══════════════════════════════════════════════════════════
     STATE SERIALIZATION
  ═══════════════════════════════════════════════════════════ */
  function serializeState() {
    return {
      schema: '1.0',
      app: 'BertinoMusicBlocs',
      savedAt: new Date().toISOString(),
      projectName: $('project-name').value,
      key: S.key,
      timeSign: S.timeSign,
      tempo: S.tempo,
      darkMode: S.darkMode,
      version: S.version,
      groupCollapsed: S.groupCollapsed,
      tracks: S.tracks,
      blocks: S.blocks,
    }
  }

  function loadState(data) {
    if (data.app && data.app !== 'BertinoMusicBlocs') {
      // still try to load for forward-compat
    }
    S.key      = data.key      || 'C'
    S.timeSign = data.timeSign || '4/4'
    S.tempo    = data.tempo    || 120
    S.darkMode = data.darkMode !== false
    S.version  = data.version  || 1
    S.tracks        = data.tracks        || []
    S.blocks = (data.blocks || []).map(b => ({
      ...b,
      staffNotes: sanitizeStaffNotes(b.staffNotes),
      fretDots: Array.isArray(b.fretDots) ? b.fretDots : [],
      measures: Math.max(1, b.measures || 1),
    }))
    S.groupCollapsed = data.groupCollapsed || false
    S.projectName = data.projectName || 'Untitled Project'

    // Sync counters
    TID = S.tracks.reduce((m,t) => Math.max(m, +(t.id.replace('t',''))||0), 0) + 1
    BID = S.blocks.reduce((m,b) => Math.max(m, +(b.id.replace('b',''))||0), 0) + 1

    $('project-name').value = S.projectName
    $('key-select').value   = S.key
    $('time-select').value  = S.timeSign
    $('tempo-input').value  = S.tempo
    $('version-badge').textContent = 'v' + S.version
    document.documentElement.classList.toggle('light', !S.darkMode)
    $('dark-toggle').textContent = S.darkMode ? '🌙' : '☀️'

    S.selectedBlockId = null
    closePanel()
    updateKeyInfo()
    render()
  }

  /* ═══════════════════════════════════════════════════════════
     KEYBOARD SHORTCUTS
  ═══════════════════════════════════════════════════════════ */
  function bindKeys() {
    document.addEventListener('click', e => {
      const popup = $('staff-popup')
      if (popup && popup.classList.contains('open') && !popup.contains(e.target)) {
        hideStaffPopup()
      }
    })
    document.addEventListener('keydown', e => {
      const mod = e.metaKey || e.ctrlKey
      if (mod && e.key === 's') { e.preventDefault(); saveProject() }
      if (mod && e.key === 'o') { e.preventDefault(); openProject() }
      if (mod && e.key === 'n') { e.preventDefault(); newProject() }
      if (e.key === 'Escape') {
        if (_selectedNote) { _selectedNote = null; render(); return }
        if ($('staff-popup').classList.contains('open'))          hideStaffPopup()
        else if ($('staff-palette-float').classList.contains('open')) hideStaffPalette()
        else if ($('railroad-overlay').classList.contains('open')) closeRailroad()
        else if ($('modal-add-track').classList.contains('open')) closeAddTrack()
        else closePanel()
      }
      if ((e.key === 'Delete' || e.key === 'Backspace') && S.selectedBlockId &&
          !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) {
        deleteBlock()
      }

      // ── Arrow keys: move selected staff note ──────────────────
      if (_selectedNote && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
        if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return
        e.preventDefault()
        const block = S.blocks.find(b => b.id === _selectedNote.blockId)
        if (!block) { _selectedNote = null; return }
        const tokens = (block.staffNotes||'').trim().split(/\s+/).filter(Boolean)
        const { tokenIdx } = _selectedNote
        if (tokenIdx < 0 || tokenIdx >= tokens.length) return

        if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
          // Shift pitch by one diatonic step
          const dir = e.key === 'ArrowUp' ? 1 : -1
          const [dur, noteStr] = tokens[tokenIdx].split(':')
          if (noteStr && noteStr !== 'Rest') {
            tokens[tokenIdx] = `${dur}:${shiftNotePitch(noteStr, dir)}`
            block.staffNotes = tokens.join(' ')
            refreshStaffChip(block)
          }
        } else if (e.key === 'ArrowLeft' && tokenIdx > 0) {
          // Swap with previous token
          ;[tokens[tokenIdx-1], tokens[tokenIdx]] = [tokens[tokenIdx], tokens[tokenIdx-1]]
          block.staffNotes = tokens.join(' ')
          _selectedNote = { ..._selectedNote, tokenIdx: tokenIdx - 1 }
          refreshStaffChip(block)
        } else if (e.key === 'ArrowRight' && tokenIdx < tokens.length - 1) {
          // Swap with next token
          ;[tokens[tokenIdx], tokens[tokenIdx+1]] = [tokens[tokenIdx+1], tokens[tokenIdx]]
          block.staffNotes = tokens.join(' ')
          _selectedNote = { ..._selectedNote, tokenIdx: tokenIdx + 1 }
          refreshStaffChip(block)
        }
      }
    })
  }

  function newProject() {
    if (S.tracks.length > 0 || S.blocks.length > 0) {
      if (!confirm('Start a new project? Unsaved changes will be lost.')) return
    }
    S = {
      tracks: [], blocks: [], selectedBlockId: null,
      key: 'C', timeSign: '4/4', tempo: 120, darkMode: S.darkMode,
      versions: [], version: 1, projectName: 'Untitled Project',
      groupCollapsed: false,
    }
    TID = 1; BID = 1
    $('project-name').value = 'Untitled Project'
    $('key-select').value = 'C'
    $('time-select').value = '4/4'
    $('tempo-input').value = 120
    $('version-badge').textContent = 'v1'
    ensureDefaultTracks()
    closePanel()
    updateKeyInfo()
    render()
    updateContextPanels(null)
    toast('New project')
  }

  /* ═══════════════════════════════════════════════════════════
     UTILITY
  ═══════════════════════════════════════════════════════════ */
  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  }

  /* ═══════════════════════════════════════════════════════════
     DEFAULT TRACKS
  ═══════════════════════════════════════════════════════════ */
  function ensureDefaultTracks() {
    // Build order: 1.Lyrics  2.Fretboard  3.Structure  …sub-tracks…  4.Staff
    // Only insert if not already present (forward-compat with saved files)

    if (!S.tracks.some(t => t.type === 'staff'))
      S.tracks.push({ id:'t'+TID++, type:'staff', name:'Staff' })

    if (!S.tracks.some(t => t.type === 'structure'))
      S.tracks.unshift({ id:'t'+TID++, type:'structure', name:'Structure' })

    if (!S.tracks.some(t => t.type === 'fretboard')) {
      const sIdx = S.tracks.findIndex(t => t.type === 'structure')
      S.tracks.splice(Math.max(0, sIdx), 0, { id:'t'+TID++, type:'fretboard', name:'Fretboard' })
    }

    if (!S.tracks.some(t => t.type === 'lyrics'))
      S.tracks.unshift({ id:'t'+TID++, type:'lyrics', name:'Lyrics' })
  }

  /* ═══════════════════════════════════════════════════════════
     PALETTE CONTEXT PANELS
  ═══════════════════════════════════════════════════════════ */
  let _staffDur    = 'q'  // current note duration
  let _staffAcc    = ''   // current accidental
  let _staffOctave = 4    // current octave for right-panel note entry

  function updateContextPanels(block) {
    const ctx = $('palette-ctx')
    if (!ctx) return
    ctx.innerHTML = ''
    ctx.appendChild(buildCtxLyrics(block))
    ctx.appendChild(buildCtxFretboard(block))
    ctx.appendChild(buildCtxStaff(block))
  }

  // ── LYRICS ────────────────────────────────────────────────
  function buildCtxLyrics(block) {
    const sec = el('div', 'ctx-section')
    sec.appendChild(el('div', 'ctx-section-title', 'Lyrics'))
    if (!block) { sec.appendChild(el('div', 'ctx-empty', 'Select a block')); return sec }
    const ta = el('textarea', 'ctx-lyrics-area')
    ta.placeholder = 'Enter lyrics…'
    ta.value = block.lyrics || ''
    ta.addEventListener('input', () => {
      block.lyrics = ta.value
      const pf = $('pf-lyrics')
      if (pf) pf.value = ta.value
      // Live-update lyrics chip text
      const chipText = document.querySelector(`.block-chip[data-block-id="${block.id}"] .lyrics-chip-text`)
      const chipEmpty = document.querySelector(`.block-chip[data-block-id="${block.id}"] .lyrics-chip-empty`)
      if (chipText) chipText.textContent = ta.value
      if (chipEmpty && ta.value.trim()) {
        chipEmpty.className = 'lyrics-chip-text'
        chipEmpty.textContent = ta.value

  // ── FRETBOARD ─────────────────────────────────────────────

    }
    container.appendChild(grid)

    const hint = el('div', 'fret-scroll-hint')

  // ── STAFF ─────────────────────────────────────────────────
  // Inline SVG for note symbols that don't render in all fonts
  const NOTE_SVG = {
    w: `<svg width="16" height="20" viewBox="0 0 16 20"><ellipse cx="8" cy="14" rx="6" ry="4" stroke="currentColor" stroke-width="1.6" fill="none" transform="rotate(-15,8,14)"/></svg>`,
    h: `<svg width="16" height="20" viewBox="0 0 16 20"><ellipse cx="7" cy="15" rx="5.5" ry="3.5" stroke="currentColor" stroke-width="1.6" fill="none" transform="rotate(-15,7,15)"/><line x1="12.5" y1="14" x2="12.5" y2="1" stroke="currentColor" stroke-width="1.6"/></svg>`,
    s: `<svg width="18" height="20" viewBox="0 0 18 20"><ellipse cx="7" cy="15" rx="5.5" ry="3.5" fill="currentColor" transform="rotate(-15,7,15)"/><line x1="12.5" y1="14" x2="12.5" y2="0" stroke="currentColor" stroke-width="1.6"/><path d="M12.5 0.5 Q18 4 12.5 8" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M12.5 5 Q18 8.5 12.5 13" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>`,
    rest: `<svg width="14" height="20" viewBox="0 0 14 20"><line x1="2" y1="5" x2="12" y2="5" stroke="currentColor" stroke-width="1.5"/><line x1="12" y1="5" x2="2" y2="13" stroke="currentColor" stroke-width="1.5"/><line x1="2" y1="13" x2="12" y2="13" stroke="currentColor" stroke-width="1.5"/><circle cx="9.5" cy="17" r="2.5" fill="currentColor"/></svg>`,
  }

  const DURATIONS = [
    { k:'w',  sym: NOTE_SVG.w,                              tip:'Ronde'           },
    { k:'h',  sym: NOTE_SVG.h,                              tip:'Blanche'         },
    { k:'q',  sym: '♩',                                     tip:'Noire'           },
    { k:'e',  sym: '♪',                                     tip:'Croche'          },
    { k:'s',  sym: NOTE_SVG.s,                              tip:'Double croche'   },
    { k:'qt', sym: '♩<sup style="font-size:7px">3</sup>',   tip:'Noire triolet'   },
    { k:'et', sym: '♪<sup style="font-size:7px">3</sup>',   tip:'Croche triolet'  },
  ]
  const DUR_SYMS = { w:'○', h:'◑', q:'♩', e:'♪', s:'♬', qt:'♩³', et:'♪³' }

  // Treble-clef SVG for staff chip header
  const TREBLE_CLEF_SVG = `<svg width="14" height="52" viewBox="0 0 14 52" fill="none"><path d="M7 50 C3 44 2 38 2 32 C2 26 4 22 7 20 C10 18 12 20 12 24 C12 30 8 33 5 35 C2.5 37 2 39 2 41 C2 45 4.5 47 7.5 47 C10.5 47 12.5 44.5 12.5 41 C12.5 34 11 27 10 20 C9 13 9 7 11 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="7.5" cy="25" r="1.6" fill="currentColor"/></svg>`

  // Treble-clef pitch → y-position map (in a 80px staff chip content area)
  // Lines at y=16,26,36,46,56; step = 5px
  const STAFF_PITCH_Y = {
    // Octave 6 (above)
    'C6':1,
    // Octave 5
    'B5':6,'A5':8,'G5':11,'F5':16,'E5':21,'D5':26,'C5':31,
    // Octave 4
    'B4':36,'A4':41,'G4':46,'F4':51,'E4':56,'D4':61,'C4':66,
    // Octave 3 (below staff — ledger lines drawn in buildStaffSVG)
    'B3':71,'A3':76,'G3':81,'F3':86,'E3':91,'D3':96,'C3':101,
    // Sharps octave 5
    'G#5':11,'F#5':16,'E#5':21,'D#5':26,'C#5':31,'B#4':36,'A#4':41,'G#4':46,'F#4':51,'E#4':56,'D#4':61,'C#4':66,
    // Flats octave 5
    'Bb5':6,'Ab5':8,'Gb5':16,'Fb5':21,'Eb5':26,'Db5':31,'Cb5':36,
    // Sharps/flats octave 4
    'Bb4':41,'Ab4':46,'Gb4':51,'Eb4':56,'Db4':61,
    // Sharps/flats octave 3
    'B#3':71,'A#3':76,'G#3':81,'F#3':86,'E#3':91,'D#3':96,'C#3':101,
    'Bb3':71,'Ab3':76,'Gb3':81,'Eb3':91,'Db3':96,
  }

  // ── v1.5: Staff token parsing ───────────────────────────────
  const STAFF_BEAT_VALUES = { w:4, h:2, q:1, e:0.5, s:0.25, qt:2/3, et:1/3, ht:4/3 }

  const STAFF_KEYSIG = {
    sharps: { C:0,G:1,D:2,A:3,E:4,B:5,'F#':6,'C#':7,
              Am:0,Em:1,Bm:2,'F#m':3,'C#m':4,'G#m':5,'D#m':6,'A#m':7 },
    flats:  { F:1,Bb:2,Eb:3,Ab:4,Db:5,Gb:6,Cb:7,
              Dm:1,Gm:2,Cm:3,Fm:4,Bbm:5,Ebm:6,Abm:7 },
    sharpY: [16,31,11,26,41,21,36],   // F5 C5 G5 D5 A4 E5 B4
    flatY:  [36,21,41,26,46,31,51],   // B4 E5 A4 D5 G4 C5 F4
  }

  function keySigInfo(key) {
    const ns = STAFF_KEYSIG.sharps[key]
    if (ns > 0) return { type:'#', count:ns, yPos: STAFF_KEYSIG.sharpY.slice(0,ns) }
    const nf = STAFF_KEYSIG.flats[key]
    if (nf > 0) return { type:'b', count:nf, yPos: STAFF_KEYSIG.flatY.slice(0,nf) }
    return { type:'', count:0, yPos:[] }
  }

  // Returns array of { dur, dotted, note, beats, measureIdx, beatInMeasure }
  function parseStaffTokens(staffNotes, beatsPerMeasure) {
    const bpm = beatsPerMeasure || 4
    const raw = (staffNotes||'').trim().split(/\s+/).filter(Boolean)
    const out = []
    let beatPos = 0
    for (const token of raw) {
      const ci = token.indexOf(':')
      if (ci < 0) continue
      const durRaw = token.slice(0, ci)
      const note   = token.slice(ci + 1)
      const dotted = durRaw.endsWith('.')
      const durKey = dotted ? durRaw.slice(0,-1) : durRaw
      let beats = STAFF_BEAT_VALUES[durKey] ?? 1
      if (dotted) beats *= 1.5
      const measureIdx    = Math.floor(beatPos / bpm)
      const beatInMeasure = beatPos - measureIdx * bpm
      out.push({ dur:durKey, dotted, note, beats, measureIdx, beatInMeasure, beatPos })
      beatPos += beats
    }
    return { notes:out, totalBeats:beatPos }
  }

  function sanitizeStaffNotes(raw) {
    if (!raw || typeof raw !== 'string') return ''
    const VALID = new Set(['w','h','q','e','s','qt','et','ht'])
    return (raw.trim().split(/\s+/).filter(token => {
      const ci = token.indexOf(':')
      if (ci < 0) return false
      const d = token.slice(0,ci).replace('.','')
      const n = token.slice(ci+1)
      return VALID.has(d) && n.length >= 1
    })).join(' ')
  }

  function buildCtxStaff(block) {
    const sec = el('div', 'ctx-section')
    // Title row with "Open palette" button
    const titleRow = el('div', 'ctx-section-title', '')
    titleRow.style.display = 'flex'; titleRow.style.justifyContent = 'space-between'; titleRow.style.alignItems = 'center'
    titleRow.appendChild(document.createTextNode('Staff'))
    const palBtn = el('button', 'btn', '⠿ Palette')
    palBtn.style.cssText = 'padding:1px 7px;font-size:10px;height:20px;cursor:pointer'
    palBtn.title = 'Ouvrir la palette flottante'
    palBtn.addEventListener('click', () => showStaffPalette(block))
    titleRow.appendChild(palBtn)
    sec.appendChild(titleRow)
    if (!block) { sec.appendChild(el('div', 'ctx-empty', 'Sélectionner un bloc')); return sec }
    if (!block.staffNotes) block.staffNotes = ''

    // Duration row
    const durRow = el('div', 'ctx-staff-row')
    const durBtns = {}
    DURATIONS.forEach(({ k, sym, tip }) => {
      const btn = el('button', 'ctx-staff-btn' + (k===_staffDur?' sel':''), sym)
      btn.title = tip
      btn.addEventListener('click', () => {
        _staffDur = k
        Object.values(durBtns).forEach(b => b.classList.remove('sel'))
        btn.classList.add('sel')
      })
      durBtns[k] = btn
      durRow.appendChild(btn)
    })
    const restBtn = el('button', 'ctx-staff-btn', NOTE_SVG.rest)
    restBtn.title = 'Silence'
    restBtn.addEventListener('click', () => staffAppend(block, 'Rest', display))
    durRow.appendChild(restBtn)
    sec.appendChild(durRow)

    // Accidentals row
    const accRow = el('div', 'ctx-staff-row')
    const ACC = [{ k:'#', sym:'♯' }, { k:'b', sym:'♭' }, { k:'', sym:'♮' }]
    const accBtns = {}
    ACC.forEach(({ k, sym }) => {
      const btn = el('button', 'ctx-staff-btn' + (k===_staffAcc?' acc-sel':''), sym)
      btn.addEventListener('click', () => {
        _staffAcc = k
        Object.values(accBtns).forEach(b => b.classList.remove('acc-sel'))
        btn.classList.add('acc-sel')
      })
      accBtns[k] = btn
      accRow.appendChild(btn)
    })
    sec.appendChild(accRow)

    // Octave selector
    const octRow = el('div', 'ctx-staff-row')
    const octBtns = {}
    ;[3,4,5,6].forEach(oct => {
      const btn = el('button', 'ctx-staff-btn' + (oct === _staffOctave ? ' sel' : ''), String(oct))
      btn.title = `Octave ${oct}`
      btn.addEventListener('click', () => {
        _staffOctave = oct
        Object.values(octBtns).forEach(b => b.classList.remove('sel'))
        btn.classList.add('sel')
      })
      octBtns[oct] = btn; octRow.appendChild(btn)
    })
    const octLabel = el('span', '', 'oct')
    octLabel.style.cssText = 'font-size:9px;opacity:0.5;margin-left:3px;align-self:center'
    octRow.appendChild(octLabel)
    sec.appendChild(octRow)

    // Note buttons
    const noteRow = el('div', 'ctx-staff-row')
    ;['C','D','E','F','G','A','B'].forEach(n => {
      const btn = el('button', 'ctx-staff-btn', n)
      btn.addEventListener('click', () => staffAppend(block, n, display))
      noteRow.appendChild(btn)
    })
    sec.appendChild(noteRow)

    // Control row
    const ctrlRow = el('div', 'ctx-staff-row')
    const bkBtn = el('button', 'ctx-staff-btn', '⌫')
    bkBtn.title = 'Delete last note'
    bkBtn.addEventListener('click', () => {
      const tokens = (block.staffNotes||'').trim().split(/\s+/).filter(Boolean)
      tokens.pop()
      block.staffNotes = tokens.join(' ')
      display.textContent = staffFormat(block.staffNotes)
      refreshStaffChip(block)
    })
    const clrBtn = el('button', 'ctx-staff-btn', '✕')
    clrBtn.title = 'Clear all'
    clrBtn.addEventListener('click', () => {
      block.staffNotes = ''
      display.textContent = '—'
      refreshStaffChip(block)
    })
    ctrlRow.appendChild(bkBtn)
    ctrlRow.appendChild(clrBtn)
    sec.appendChild(ctrlRow)

    // Display
    const display = el('div', 'ctx-staff-display')
    display.textContent = staffFormat(block.staffNotes)
    sec.appendChild(display)
    return sec
  }

  function staffAppend(block, noteName, displayEl) {
    const token = noteName === 'Rest'
      ? `${_staffDur}:Rest`
      : `${_staffDur}:${noteName}${_staffAcc}${_staffOctave}`
    _staffAcc = ''
    block.staffNotes = block.staffNotes ? block.staffNotes+' '+token : token
    if (displayEl) displayEl.textContent = staffFormat(block.staffNotes)
    refreshStaffChip(block)
  }

  function staffFormat(notes) {
    if (!notes || !notes.trim()) return '—'
    return notes.trim().split(/\s+/).map(t => {
      const [dur, note] = t.split(':')
      return (DUR_SYMS[dur]||dur) + (note||'')
    }).join(' ')
  }

  /* ═══════════════════════════════════════════════════════════
     FRETBOARD DIAGRAM
  ═══════════════════════════════════════════════════════════ */
  const FRET_STRINGS  = ['E', 'A', 'D', 'G', 'B', 'e']  // low → high
  const FRET_MARKERS  = new Set([3, 5, 7, 9, 15])        // single-dot frets
  const FRET_MARKERS_DBL = new Set([12])                  // double-dot (octave)
  const FRET_COUNT    = 16

  function buildFretboard(block) {
    if (!block.fretDots) block.fretDots = []

    const wrap = el('div', 'field-group')
    wrap.appendChild(el('div', 'field-label', 'Fretboard  (frets 1 – 16)'))

    const container = el('div', 'fretboard-container')
    const grid = el('div', 'fretboard-grid')

    // Header row: corner + fret numbers 1..16
    grid.appendChild(el('div', 'fret-corner'))
    for (let f = 1; f <= FRET_COUNT; f++) {
      let cls = 'fret-label'
      if (FRET_MARKERS_DBL.has(f)) cls += ' marker-dbl'
      else if (FRET_MARKERS.has(f)) cls += ' marker'
      grid.appendChild(el('div', cls, String(f)))
    }

    // String rows: e(s=6) → E(s=1), top to bottom (standard chord-diagram view)
    for (let si = 5; si >= 0; si--) {
      const s = si + 1
      grid.appendChild(el('div', 'fret-str-header', FRET_STRINGS[si].toUpperCase()))
      for (let f = 1; f <= FRET_COUNT; f++) {
        const cell = el('div', 'fret-cell')
        if (block.fretDots.some(d => d.f === f && d.s === s)) {
          cell.classList.add('has-dot')
          cell.appendChild(el('div', 'fret-dot'))
        }
        cell.addEventListener('click', () => {
          toggleFretDot(block, f, s, cell)
          updateFretHint(block, hintCount)
        })
        grid.appendChild(cell)
      }
    }
    container.appendChild(grid)

    // ── Status bar: dot count + scroll hint ──
    const hint = el('div', 'fret-scroll-hint')
    const hintCount = el('span', 'fret-dot-count', String(block.fretDots.length))
    hint.appendChild(hintCount)
    hint.appendChild(document.createTextNode(' dots placed  ·  scroll ↔ frets 1–16'))
    container.appendChild(hint)

    wrap.appendChild(container)
    return wrap
  }

  function toggleFretDot(block, fret, string, cellEl) {
    if (!block.fretDots) block.fretDots = []
    const idx = block.fretDots.findIndex(d => d.f === fret && d.s === string)
    if (idx >= 0) {
      block.fretDots.splice(idx, 1)
      cellEl.classList.remove('has-dot')
      cellEl.innerHTML = ''
    } else {
      block.fretDots.push({ f: fret, s: string })
      cellEl.classList.add('has-dot')
      cellEl.appendChild(el('div', 'fret-dot'))
    }
  }

  function updateFretHint(block, countEl) {
    countEl.textContent = String(block.fretDots.length)
  }

  /* ═══════════════════════════════════════════════════════════
     RAILROAD VIEW
  ═══════════════════════════════════════════════════════════ */
  function showRailroad() {
    const RR_MW    = 48   // px per measure in railroad
    const overlay  = $('railroad-overlay')
    const scroll   = $('railroad-scroll')
    const titleEl  = $('rr-title')
    const metaEl   = $('rr-meta')
    const projName = $('project-name').value || 'Untitled Project'

    titleEl.textContent = '🚂 ' + projName
    metaEl.textContent  = `${S.key} • ${S.timeSign} • ${S.tempo} BPM`

    scroll.innerHTML = ''

    const RR_EXCLUDE = new Set(['lyrics','fretboard','staff'])
    const rrTracks = S.tracks.filter(t => !RR_EXCLUDE.has(t.type))

    if (rrTracks.length === 0) {
      const msg = el('div', 'rr-no-tracks')
      msg.innerHTML = '<div style="font-size:36px;opacity:0.3">🎼</div><p>Aucune piste d\'arrangement.</p>'
      scroll.appendChild(msg)
      overlay.classList.add('open')
      return
    }

    // Compute last used measure across all visible blocks
    const visibleBlocks = S.blocks.filter(b => rrTracks.some(t => t.id === b.trackId))
    const lastMeasure = visibleBlocks.length
      ? Math.max(...visibleBlocks.map(b => b.measure + b.measures - 1))
      : MEASURES
    const totalMeasures = Math.max(lastMeasure, 16)
    const timelineW = totalMeasures * RR_MW

    // ── Ruler ──
    const ruler = el('div', 'rr-ruler')
    ruler.appendChild(el('div', 'rr-ruler-spacer'))
    for (let m = 0; m < totalMeasures; m++) {
      const mark = el('div', 'rr-ruler-mark', String(m))
      mark.style.minWidth = RR_MW + 'px'
      mark.style.width    = RR_MW + 'px'
      ruler.appendChild(mark)
    }
    scroll.appendChild(ruler)

    // ── Track rows ──
    rrTracks.forEach(track => {
      const cfg = TRACK_CONFIGS[track.type] || { icon:'🎵', badge:'TRACK' }
      const trackBlocks = S.blocks
        .filter(b => b.trackId === track.id && !b.muted)
        .sort((a, b) => a.measure - b.measure)

      const row = el('div', 'rr-track')

      // Label
      const labelEl = el('div', 'rr-track-label')
      labelEl.innerHTML = `
        <div class="rr-track-name">${cfg.icon} ${esc(track.name)}</div>
        <div class="rr-track-badge">${cfg.badge}</div>
      `
      row.appendChild(labelEl)

      // Timeline
      const timeline = el('div', 'rr-track-timeline')
      timeline.style.width    = timelineW + 'px'
      timeline.style.minWidth = timelineW + 'px'
      timeline.style.backgroundSize = `${RR_MW}px 100%`

      trackBlocks.forEach(block => {
        const def = BLOCK_DEFS[block.type] || { label: block.type, icon:'◼' }
        const car = el('div', `rr-car bloc-${block.type}`)
        car.style.left  = ((block.measure - 1) * RR_MW) + 'px'
        car.style.width = (block.measures * RR_MW - 4) + 'px'
        car.title = block.chords ? `${block.name} — ${block.chords}` : block.name
        car.innerHTML = `
          <span class="rr-car-icon">${def.icon}</span>
          <span class="rr-car-name">${esc(block.name)}</span>
          ${block.chords ? `<span class="rr-car-chords">${esc(block.chords)}</span>` : ''}
        `
        timeline.appendChild(car)
      })

      row.appendChild(timeline)
      scroll.appendChild(row)
    })

    overlay.classList.add('open')
  }

  function closeRailroad() {
    $('railroad-overlay').classList.remove('open')
  }

  function printRailroad() {
    window.print()
  }

  /* ═══════════════════════════════════════════════════════════
     ELECTRON WIRE-UP — override browser functions with native
  ═══════════════════════════════════════════════════════════ */
  function wireElectron() {
    if (!window.electronAPI) return

    // Override save
    saveProject = async function() {
      const data = serializeState()
      const name = ($('project-name').value || 'project').replace(/[^a-zA-Z0-9_\- ]/g,'')
      const result = await window.electronAPI.saveJSON(data, name + '.bmb')
      if (result.ok) toast('Project saved → ' + result.filePath.split(/[\\/]/).pop())
    }

    // Override open
    openProject = async function() {
      const result = await window.electronAPI.openJSON()
      if (!result.ok) return
      try { loadState(result.data); toast('Project loaded') }
      catch { toast('Error reading project file') }
    }

    // Override export HTML
    exportHTML = async function() {
      const html = buildExportHTML()
      const name = ($('project-name').value || 'chart').replace(/[^a-zA-Z0-9_\- ]/g,'')
      const result = await window.electronAPI.exportHTML(html, name + '.html')
      if (result.ok) toast('HTML exported → ' + result.filePath.split(/[\\/]/).pop())
    }

    // Override MIDI import
    showMidiImport = async function() {
      const result = await window.electronAPI.importMidi()
      if (!result.ok) return
      toast('MIDI imported (simulation) — ' + result.filePath.split(/[\\/]/).pop(), 3000)
    }

    // Load a recent project opened from the File menu
    window.electronAPI.onLoadRecent(({ data, filePath, error }) => {
      if (error) { toast('⚠ File not found: ' + (filePath||'').split(/[\\/]/).pop()); return }
      try { loadState(data); toast('Opened: ' + filePath.split(/[\\/]/).pop()) }
      catch { toast('Error reading project') }
    })

    // Listen for menu actions (Cmd+S, Cmd+O, etc.)
    window.electronAPI.onMenuAction(action => {
      switch (action) {
        case 'new':         newProject(); break
        case 'save':        saveProject(); break
        case 'open':        openProject(); break
        case 'export-html': exportHTML(); break
        case 'export-pdf':  exportPDF(); break
        case 'import-midi': showMidiImport(); break
        case 'toggle-dark': toggleDark(); break
      }
    })
  }

  /* ═══════════════════════════════════════════════════════════
     START
  ═══════════════════════════════════════════════════════════ */
  document.addEventListener('DOMContentLoaded', init)
  </script>
</body>
</html>
